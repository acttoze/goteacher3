<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>티로드 — 오늘</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html" title="기획서로">
      <img src="assets/logo.svg" width="26" height="26" alt="">티로드<small>티로드초</small>
    </a>
    <nav class="nav" aria-label="주 메뉴">
      <a href="#today" data-r="today">오늘</a>
      <a href="#cal" data-r="cal">일정</a>
      <a href="#collect" data-r="collect">모으기<span class="dot" hidden></span></a>
      <a href="#notice" data-r="notice">공지<span class="dot" hidden></span></a>
      <a href="#school" data-r="school">학교</a>
    </nav>
    <div class="qi">
      <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <label for="qi" class="sr">한 줄로 일정 추가</label>
      <input id="qi" autocomplete="off" placeholder="한 줄로 추가 — 예: 내일 3~4교시 5학년 과학실1 실험 안전교육 @차민호">
      <kbd>N</kbd>
      <div class="qpop" id="qpop" aria-live="polite"></div>
    </div>
    <div class="who">
      <button class="bell" id="bell" aria-label="알림"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="cnt" hidden>0</span></button>
      <div class="bellpop" id="bellpop" role="dialog" aria-label="알림 목록"></div>
      <label for="who" class="sr">시연 역할</label>
      <select id="who"><option value="teacher">정하은 · 4학년 2반</option><option value="vp">이정민 · 교감</option></select>
      <span class="avatar" aria-hidden="true">정</span>
      <button class="btn sm ghost" id="reset" title="시연 데이터 초기화">↺</button>
    </div>
  </div>
</header>
<main class="page" id="view"></main>
<div class="modal-bg" id="modal"></div>
<script src="assets/data.js"></script>
<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
