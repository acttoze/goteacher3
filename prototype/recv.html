<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>티로드</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{background:var(--bg)}
  .m-top{display:flex;align-items:center;gap:9px;padding:12px 23px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
  .m-top b{font-size:17px}
  .m-wrap{padding:23px 18px 37px;display:grid;gap:16px;max-width:736px;margin:0 auto}
  .m-h h1{font-size:22px;line-height:30px}
  .m-meta{font-size:15px;color:var(--muted);margin-top:5px;display:grid;gap:2px}
  .m-card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface)}
  .m-card h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .f{display:grid;gap:6px;margin-bottom:14px}
  .f label{font-size:15px;font-weight:600}
  .f input,.f select{height:44px;border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;background:var(--surface);font-size:16px}
  .f input:focus,.f select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .big{height:46px;width:100%;font-size:17px;border-radius:12px}
  .others{display:flex;gap:5px;flex-wrap:wrap}
  .others span{font-size:13px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
  .others span.d{background:var(--ok-soft);color:var(--ok)}
  .done-hero{text-align:center;padding:21px 9px}
  .done-hero .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
  .mini li{list-style:none;display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .mini{margin:0;padding:0}
  .mini li:first-child{border-top:0}
  .mini .p{width:60px;color:var(--muted);flex:none}
  .guide-l{margin:0;padding-left:20px;font-size:15px;display:grid;gap:3px}
  .items{display:grid;gap:9px}
  .itm{display:grid;grid-template-columns:minmax(0,1fr) 72px 104px 104px 34px;gap:7px;align-items:center}
  .itm input{height:42px;border:1px solid var(--line-strong);border-radius:9px;padding:0 10px;background:var(--surface);font-size:15px;min-width:0}
  .itm .amt{text-align:right;font-weight:600}
  .itm .lnk{grid-column:1/5}
  .itm-h{font-size:13px;color:var(--muted);font-weight:600}
  .budget{display:flex;justify-content:space-between;font-size:15px;padding:10px 12px;border-radius:9px;background:var(--surface-2);margin-top:12px}
  .budget.over{background:var(--danger-soft);color:var(--danger)}
  .trn{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .trn:first-of-type{border-top:0}
  .trn input[type=text]{height:42px;border:1px solid var(--line-strong);border-radius:9px;padding:0 10px;font-size:15px;width:100%}
  .trn input:disabled{background:var(--surface-2);color:var(--faint)}
</style>
</head>
<body>
<div class="m-top"><img src="assets/logo.svg" width="22" height="22" alt=""><b>티로드</b><span class="small muted">· 티로드초등학교</span></div>
<main class="m-wrap" id="m"></main>
<script src="assets/data.js"></script>
<script src="assets/forms.js"></script>
<script src="assets/core.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), esc = TR.esc, root = document.getElementById('m');
  var meKey = 'troad.me';
  function getMe() { try { return localStorage.getItem(meKey); } catch (e) { return null; } }
  function setMe(n) { try { localStorage.setItem(meKey, n); } catch (e) {} }
  function post(msg) { try { parent.postMessage(msg, '*'); } catch (e) {} }

  function pickName(next, guess) {
    root.innerHTML = '<div class="m-h"><h1>누구신가요?</h1><div class="m-meta">처음 한 번만 고르면 이 PC 브라우저가 기억해요. 가입·비밀번호는 없습니다.</div></div>' +
      '<div class="f"><label for="nm">학교 명부에서 이름 선택 (그룹별)</label><select id="nm">' + TR.groups.map(function (g) { var ms = (TR.state.members || TR.seedMembers).filter(function (m) { return m.group === g.id; }); return ms.length ? '<optgroup label="' + esc(g.name) + '">' + ms.map(function (m) { return '<option value="' + esc(m.name) + '"' + (m.name === guess ? ' selected' : '') + '>' + esc(m.name) + ' · ' + esc(TR.posText(m)) + '</option>'; }).join('') + '</optgroup>' : ''; }).join('') + '</select></div>' +
      '<button class="btn pri big" id="go">계속</button><p class="small faint">명부에 없으면 이름을 입력하고 그룹(학년·교무실…)과 직책만 고르면 됩니다.</p>';
    document.getElementById('go').onclick = function () { setMe(document.getElementById('nm').value); next(); };
  }

  function collect() {
    var c = TR.state.collections.find(function (x) { return x.id === q.get('c'); });
    if (!c) { root.innerHTML = '<p>요청을 찾을 수 없어요.</p>'; return; }
    var unit = q.get('u') || c.rows[0].unit;
    var row = c.rows.find(function (r) { return r.unit === unit; }) || c.rows[0];
    // 사람 줄은 그 사람만, 그룹 줄(그룹별 모으기)은 그 그룹 구성원 누구나
    if (q.get('me')) setMe(row.gid ? TR.me.name : row.who);
    var me = getMe();
    if (!me || (!TR.rowMine(row, me) && !q.get('force'))) { setMe(''); return pickName(collect, row.gid ? '' : row.who); }
    if (c.kind === 'items') return itemsForm(c, row);
    if (c.kind === 'matrix') return matrixForm(c, row);
    var done = c.rows.filter(function (r) { return r.done; }).length;
    var others = c.rows.filter(function (r) { return r.unit !== row.unit; }).slice(0, 12).map(function (r) { return '<span class="' + (r.done ? 'd' : '') + '">' + esc(r.unit) + '</span>'; }).join('');
    root.innerHTML = '<div class="m-h"><h1>' + esc(c.title) + '</h1><div class="m-meta"><span>' + (c.due ? '마감 <b style="color:' + (c.urgent ? 'var(--danger)' : 'var(--text)') + '">' + esc(c.due) + '</b>' : '마감 미정 · 정해지면 알려 드려요') + '</span><span>요청 ' + esc(c.dept) + ' ' + esc(TR.byline(c.owner)) + '</span></div></div>' +
      '<form class="m-card" id="f"><h2><span>' + esc(row.unit) + ' <span class="small muted" style="font-weight:400">' + (row.gid ? '그룹 칸 · ' + esc(me) + ' 선생님이 쓰는 중' : esc(row.who) + ' · 내 칸') + '</span></span>' + (row.done ? '<span class="badge ok">' + (row.by ? esc(row.by) + ' 제출' : '제출함') + '</span>' : '') + '</h2>' +
      (row.gid ? '<p class="small muted" style="margin:-4px 0 12px">' + esc(row.unit) + ' 선생님 누구나 이 칸을 쓸 수 있어요. 한 분이 내면 그룹 전체가 제출한 것으로 처리되고, 마감 전까지 다른 분이 고칠 수 있어요.</p>' : '') +
      c.fields.map(function (f, i) {
        var v = row.v[i] || '', id = 'f' + i;
        if (f.t === 'select') return '<div class="f"><label for="' + id + '">' + esc(f.n) + '</label><select id="' + id + '" required><option value="">선택</option>' + (f.o || []).map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
        return '<div class="f"><label for="' + id + '">' + esc(f.n) + '</label><input id="' + id + '" ' + (f.t === 'number' ? 'type="number" min="0"' : f.t === 'date' ? 'type="date"' : 'type="text"') + ' value="' + esc(v) + '"' + (f.n === '비고' ? '' : ' required') + ' placeholder="' + (f.n === '비고' ? '없으면 비워 두세요' : '') + '"></div>';
      }).join('') +
      '<button class="btn pri big" type="submit">' + (row.done ? '수정해서 다시 제출' : '제출하기') + '</button><p class="small muted" style="margin:9px 0 0;text-align:center">제출 후에도 마감 전까지 고칠 수 있어요.</p></form>' +
      '<div class="m-card"><h2>' + (row.gid ? '다른 그룹' : /^\d-\d$/.test(row.unit) ? '다른 반' : '다른 분') + ' <span class="small muted" style="font-weight:400">' + done + '/' + c.rows.length + ' 제출</span></h2><div class="others">' + others + '</div><p class="small faint" style="margin:9px 0 0">다른 반이 쓴 값은 보이지 않아요. 제출 여부만 보입니다.</p></div>';
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      TR.state = TR.load();
      var cc = TR.state.collections.find(function (x) { return x.id === c.id; }), rr = cc.rows.find(function (r) { return r.unit === row.unit; });
      rr.v = cc.fields.map(function (_, i) { return document.getElementById('f' + i).value; });
      rr.done = true; if (rr.gid) rr.by = me; var n = new Date(); rr.at = '10/26 ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
      TR.save(); post({ troad: 'submitted', c: c.id, u: row.unit });
      doneView(cc, rr);
    };
  }

  function head(c, row, sub) {
    return '<div class="m-h"><h1>' + esc(c.title) + '</h1><div class="m-meta"><span>' + (c.due ? '마감 <b>' + esc(c.due) + '</b>' : '마감 미정 · 정해지면 알려 드려요') + '</span><span>요청 ' + esc(c.dept) + ' ' + esc(TR.byline(c.owner)) + '</span></div></div>' +
      (c.guide ? '<div class="m-card"><ol class="guide-l">' + c.guide.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ol></div>' : '');
  }
  function stampNow() { var n = new Date(); return '10/26 ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }
  function fresh(c, row) { TR.state = TR.load(); var cc = TR.state.collections.find(function (x) { return x.id === c.id; }); return { c: cc, r: cc.rows.find(function (r) { return r.unit === row.unit; }) }; }

  // 학습준비물: 반이 줄을 여러 개 추가. 금액 = 수량 × 단가, 예산에서 잔액 자동.
  function itemsForm(c, row) {
    var its = (row.items || []).map(function (x) { return x.slice(); });
    if (!its.length) its.push(c.fields.map(function () { return ''; }));
    var iN = c.fields.findIndex(function (f) { return f.t === 'text'; }), nums = c.fields.map(function (f, i) { return f.t === 'number' ? i : -1; }).filter(function (i) { return i >= 0; }), iU = c.fields.findIndex(function (f) { return f.t === 'url'; });
    var amt = function (it) { return nums.length >= 2 ? nums.reduce(function (a, i) { return a * (+it[i] || 0); }, 1) : 0; };
    var won = function (n) { return (+n || 0).toLocaleString('ko-KR'); };
    function render() {
      var spent = its.reduce(function (a, it) { return a + amt(it); }, 0), left = (c.budget || 0) - spent;
      root.innerHTML = head(c, row) +
        '<form class="m-card" id="f"><h2><span>' + esc(row.unit) + ' <span class="small muted" style="font-weight:400">' + esc(row.who) + ' · 우리 반 신청</span></span>' + (row.done ? '<span class="badge ok">제출함</span>' : '') + '</h2>' +
        '<div class="items"><div class="itm itm-h"><span>' + esc(c.fields[iN].n) + '</span><span>' + esc(c.fields[nums[0]].n) + '</span><span>' + esc(c.fields[nums[1]] ? c.fields[nums[1]].n : '') + '</span><span style="text-align:right">금액</span><span></span></div>' +
        its.map(function (it, k) {
          return '<div class="itm"><input data-k="' + k + '" data-i="' + iN + '" value="' + esc(it[iN]) + '" placeholder="예: 색종이 (양면, 100매)" required><input data-k="' + k + '" data-i="' + nums[0] + '" type="number" min="1" value="' + esc(it[nums[0]]) + '" placeholder="수량" required><input data-k="' + k + '" data-i="' + nums[1] + '" type="number" min="0" value="' + esc(it[nums[1]]) + '" placeholder="단가(원)" required><span class="amt">' + won(amt(it)) + '</span><button type="button" class="btn sm ghost" data-del="' + k + '" aria-label="이 줄 지우기">✕</button>' +
            (iU >= 0 ? '<input class="lnk" data-k="' + k + '" data-i="' + iU + '" value="' + esc(it[iU]) + '" placeholder="구입 링크 (쿠팡·아이스크림몰 상품 주소)">' : '') + '</div>';
        }).join('') + '</div>' +
        '<button type="button" class="btn" id="add" style="margin-top:12px;width:100%">＋ 줄 추가</button>' +
        (c.budget ? '<div class="budget' + (left < 0 ? ' over' : '') + '"><span>예산 ' + won(c.budget) + '원 · 신청 <b>' + won(spent) + '원</b></span><span>잔액 <b>' + won(left) + '원</b>' + (left < 0 ? ' (학년 안에서 조정 필요)' : '') + '</span></div>' : '') +
        '<button class="btn pri big" type="submit" style="margin-top:14px">' + (row.done ? '수정해서 다시 제출' : its.length + '개 물품 제출하기') + '</button><p class="small muted" style="margin:9px 0 0;text-align:center">마감 전까지 고칠 수 있어요.</p></form>';
      $$('[data-k]').forEach(function (inp) { inp.oninput = function () { its[+inp.dataset.k][+inp.dataset.i] = inp.value; var line = inp.parentNode; line.querySelector('.amt').textContent = won(amt(its[+inp.dataset.k])); var sp = its.reduce(function (a, it) { return a + amt(it); }, 0), b = document.querySelector('.budget'); if (b) { b.classList.toggle('over', c.budget - sp < 0); b.innerHTML = '<span>예산 ' + won(c.budget) + '원 · 신청 <b>' + won(sp) + '원</b></span><span>잔액 <b>' + won(c.budget - sp) + '원</b>' + (c.budget - sp < 0 ? ' (학년 안에서 조정 필요)' : '') + '</span>'; } }; });
      $$('[data-del]').forEach(function (b) { b.onclick = function () { its.splice(+b.dataset.del, 1); if (!its.length) its.push(c.fields.map(function () { return ''; })); render(); }; });
      document.getElementById('add').onclick = function () { its.push(c.fields.map(function () { return ''; })); render(); var ins = $$('[data-i="' + iN + '"]'); ins[ins.length - 1].focus(); };
      document.getElementById('f').onsubmit = function (e) {
        e.preventDefault(); var x = fresh(c, row);
        x.r.items = its.filter(function (it) { return it[iN]; }); x.r.done = true; x.r.at = stampNow();
        TR.save(); post({ troad: 'submitted', c: c.id, u: row.unit }); doneView(x.c, x.r);
      };
    }
    render();
  }
  // 연수 이수 현황: 연수마다 이수번호 한 칸. 다 못 채워도 저장, 대상 아니면 '해당 없음'.
  function matrixForm(c, row) {
    var n = row.v.filter(Boolean).length;
    root.innerHTML = head(c, row) +
      '<form class="m-card" id="f"><h2><span>' + esc(row.who) + ' <span class="small muted" style="font-weight:400">' + esc(row.pos) + ' · 내 줄</span></span><span class="badge ' + (n === row.v.length ? 'ok' : '') + '">' + n + '/' + row.v.length + '</span></h2>' +
      c.cols.map(function (x, j) {
        var v = row.v[j], na = v === '해당 없음';
        return '<div class="trn"><div><b>' + (j + 1) + '. ' + esc(x.n) + '</b><div class="small muted">' + esc(x.due) + ' · ' + esc(x.target) + ' · 담당 ' + esc(x.by) + '</div></div><div><input type="text" id="t' + j + '" value="' + esc(na ? '' : v) + '" placeholder="이수번호 붙여넣기"' + (na ? ' disabled' : '') + '><label class="small muted" style="display:flex;gap:6px;margin-top:4px"><input type="checkbox" data-na="' + j + '"' + (na ? ' checked' : '') + '> 해당 없음</label></div></div>';
      }).join('') +
      '<button class="btn pri big" type="submit" style="margin-top:14px">저장하기</button><p class="small muted" style="margin:9px 0 0;text-align:center">다 못 채워도 저장돼요. 채운 칸만 합본에 들어갑니다.</p></form>';
    $$('[data-na]').forEach(function (cb) { cb.onchange = function () { var t = document.getElementById('t' + cb.dataset.na); t.disabled = cb.checked; if (cb.checked) t.value = ''; }; });
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault(); var x = fresh(c, row);
      x.r.v = c.cols.map(function (_, j) { return document.querySelector('[data-na="' + j + '"]').checked ? '해당 없음' : document.getElementById('t' + j).value.trim(); });
      x.r.done = x.r.v.every(Boolean); x.r.at = stampNow();
      TR.save(); post({ troad: 'submitted', c: c.id, u: row.unit }); doneView(x.c, x.r);
    };
  }
  function $$(q) { return Array.prototype.slice.call(document.querySelectorAll(q)); }

  function doneView(c, r) {
    var today = TR.state.events.filter(function (e) { return TR.onDay(e, TR.TODAY) && e.type !== 'duty' && e.s; }).sort(function (a, b) { return TR.slotIdx(a.s) - TR.slotIdx(b.s); }).slice(0, 5);
    root.innerHTML = '<div class="done-hero"><div class="ck">✓</div><h1 style="font-size:22px">' + (c.kind === 'matrix' && !r.done ? '저장했어요' : '제출했어요') + '</h1><p class="muted small" style="margin:5px 0 0">' + esc(c.title) + ' · ' + esc(r.unit) + '<br>' + esc(c.owner) + ' 선생님 합본에 바로 들어갔어요.</p></div>' +
      '<button class="btn big" id="edit">고치기</button>' +
      '<div class="m-card" style="background:var(--accent-soft);border-color:transparent"><h2><span>' + TR.chgIcon + ' 오늘 바뀐 것 4건</span></h2><ul class="mini"><li><span class="p">10/29</span>학예회 리허설 장소 <del>강당</del>→<ins>체육관</ins></li><li><span class="p">3블록</span>3학년 수영교육 출발 13:10 정문 버스</li></ul></div>' +
      '<div class="m-card"><h2>오늘 학교 일과</h2><ul class="mini">' + today.map(function (e) { return '<li><span class="p">' + esc(TR.slotText(e)) + '</span><span>' + esc(e.title) + (e.place ? ' <span class="muted">· ' + esc(e.place) + '</span>' : '') + '</span></li>'; }).join('') + '</ul></div>' +
      '<a class="btn pri big" href="app.html#today" target="_top">내 「오늘」 화면 열기</a><p class="small faint" style="text-align:center;margin:0">쪽지 대신, 매일 아침 PC에서 이 한 장이면 됩니다.</p>';
    document.getElementById('edit').onclick = collect;
  }

  function notice() {
    var n = TR.state.notices.find(function (x) { return x.id === q.get('n'); });
    if (!n) { root.innerHTML = '<p>공지를 찾을 수 없어요.</p>'; return; }
    var cur = n.versions[n.versions.length - 1], prev = n.versions[n.versions.length - 2];
    var changed = prev ? Object.keys(cur.fields).filter(function (k) { return prev.fields[k] !== cur.fields[k]; }) : [];
    root.innerHTML = '<div class="m-h"><h1>' + esc(n.title) + (n.ver > 1 ? ' <span class="badge acc">v' + n.ver + '</span>' : '') + '</h1><div class="m-meta"><span>' + esc(n.dept) + ' · ' + esc(n.updated) + ' 수정</span></div></div>' +
      (changed.length ? '<div class="diff"><b style="font-size:16px">' + TR.chgIcon + ' 바뀐 부분</b><dl class="kv" style="margin-top:9px;grid-template-columns:64px 1fr">' + changed.map(function (k) { return '<dt>' + esc(k) + '</dt><dd><del>' + esc(prev.fields[k]) + '</del> → <ins>' + esc(cur.fields[k]) + '</ins></dd>'; }).join('') + '</dl></div>' : '') +
      '<div class="m-card"><dl class="kv" style="grid-template-columns:64px 1fr">' + Object.keys(cur.fields).map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + esc(cur.fields[k]) + '</dd>'; }).join('') + '</dl><details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">본문 펼치기</summary><p style="font-size:16px">' + esc(n.body) + '</p></details></div>' +
      (n.must ? (TR.state.acked[n.id] ? '<div class="btn big" style="pointer-events:none;color:var(--ok);border-color:var(--ok)">✓ 확인함</div>' : '<button class="btn pri big" id="ack">확인했어요</button>') : '<p class="small faint" style="text-align:center">이 화면을 2초 이상 보면 확인한 것으로 처리돼요.</p>');
    var a = document.getElementById('ack');
    if (a) a.onclick = function () { TR.state = TR.load(); TR.state.acked[n.id] = true; var nn = TR.state.notices.find(function (x) { return x.id === n.id; }); nn.seen = Math.min(nn.total, nn.seen + 1); TR.save(); post({ troad: 'acked', n: n.id }); notice(); };
  }

  if (q.get('c')) collect(); else if (q.get('n')) notice(); else root.innerHTML = '<p class="muted">링크가 올바르지 않아요.</p>';
})();
</script>
</body>
</html>
