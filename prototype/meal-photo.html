<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>식판 사진 올리기</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* PC 전용 원칙의 유일한 예외: 영양사가 폰으로 QR을 찍어 그 자리에서 식판 사진을 올리는 한 화면 */
  body{background:var(--bg)}
  .ph-top{display:flex;align-items:center;gap:9px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
  .ph-top b{font-size:18px}
  html,body{overflow-x:hidden}
  .ph-wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;word-break:keep-all;overflow-wrap:anywhere}
  .ph-wrap h1{font-size:24px;line-height:32px}
  .ph-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .shot{display:grid;place-items:center;gap:10px;min-height:260px;border:2px dashed var(--line-strong);border-radius:14px;background:var(--surface-2);cursor:pointer;text-align:center;padding:16px}
  .shot b{font-size:22px}
  .shot input{display:none}
  .shot img{width:100%;border-radius:10px}
  .bigbtn{width:100%;height:56px;font-size:19px;border-radius:14px}
  .done{text-align:center;padding:24px 8px}
  .done .ck{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 12px}
  .warn2{font-size:15px;color:var(--danger);background:var(--danger-soft);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="ph-top"><img src="assets/logo.svg" width="24" height="24" alt=""><b>티로드</b><span class="muted">· 식판 사진</span></div>
<main class="ph-wrap" id="m"></main>
<script src="assets/meal.js"></script>
<script>
(function () {
  var M = TR.meal, q = new URLSearchParams(location.search), S = q.get('s') || M.DEFAULT, D = q.get('d') || M.ymd(new Date());
  var root = document.getElementById('m'), t = M.label(D), data = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function form() {
    root.innerHTML = '<h1>' + t.m + '월 ' + t.d + '일 ' + t.w + '요일 점심</h1>' +
      '<div class="ph-card"><label class="shot"><input type="file" accept="image/*" capture="environment" id="file"><span id="ico" style="font-size:44px">📷</span><img id="prev" alt="찍은 식판 사진" hidden><b id="lbl">눌러서 식판 찍기</b><span class="muted" id="hint">배식 직전 오늘 식판을 찍어 주세요</span></label>' +
      '<p class="small muted" style="margin:12px 0 0" id="menu"></p></div>' +
      '<button class="btn pri bigbtn" id="up" disabled>올리기</button>' +
      '<p class="small faint" style="margin:0;text-align:center">시연용 프로토타입: 사진은 이 기기 브라우저에만 저장됩니다. 실제 서비스에서는 티로드 서버로 올라가 영양사 PC와 급식소 TV에 바로 뜹니다.</p>';
    if (data && data.meals[D]) document.getElementById('menu').textContent = '오늘 메뉴: ' + data.meals[D].dishes.map(function (x) { return x.n; }).join(' · ');
    var shot = null;
    document.getElementById('file').onchange = function () {
      var f = this.files && this.files[0]; if (!f) return;
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        // 저장 공간에 들어가도록 긴 변 1600px JPEG로 줄인다
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        shot = cv.toDataURL('image/jpeg', 0.82);
        var pv = document.getElementById('prev'); pv.src = shot; pv.hidden = false;
        document.getElementById('ico').hidden = true; document.getElementById('lbl').hidden = true;
        document.getElementById('hint').textContent = '다시 찍으려면 사진을 누르세요';
        document.getElementById('up').disabled = false;
      };
      img.src = url;
    };
    document.getElementById('up').onclick = function () {
      if (!shot) return;
      if (!M.savePhoto(S, D, shot)) { root.insertAdjacentHTML('beforeend', '<p class="warn2">저장 공간이 부족해 올리지 못했어요. 사진을 다시 찍어 주세요.</p>'); return; }
      root.innerHTML = '<div class="ph-card done"><div class="ck">✓</div><h1>올렸어요</h1><p class="muted">' + t.m + '/' + t.d + ' 식판 사진이 급식소 현황판 「오늘의 식사」에 바로 떠요.</p><button class="btn bigbtn" id="again">다른 사진으로 바꾸기</button></div>';
      document.getElementById('again').onclick = form;
    };
  }
  form();
  M.load(S, q.get('key'), M.monday(M.fromYmd(D))).then(function (d) { data = d; var el = document.getElementById('menu'); if (el && d.meals[D]) el.textContent = '오늘 메뉴: ' + d.meals[D].dishes.map(function (x) { return x.n; }).join(' · '); }).catch(function () {});
})();
</script>
</body>
</html>
