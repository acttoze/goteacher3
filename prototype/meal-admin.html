<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>급식 현황판 입력</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
  .wrap{max-width:1240px;margin:0 auto;padding:28px 36px 64px;display:grid;gap:20px}
  .top-a{display:flex;align-items:center;gap:12px;padding:14px 36px;background:var(--surface);border-bottom:1px solid var(--line)}
  .top-a b{font-size:19px}
  .top-a .grow{flex:1}
  .card-b{padding:20px 24px}
  .note{padding:12px 16px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
  .src{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:7px;font-size:14px;font-weight:600;white-space:nowrap}
  .src.auto{background:var(--primary-soft);color:var(--primary)}
  .src.me{background:var(--meet-soft);color:var(--meet)}
  .src.mix{background:var(--event-soft);color:var(--event)}
  table.t{width:100%;border-collapse:collapse;font-size:16px}
  table.t th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;font-size:15px}
  table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t td.c,table.t th.c{text-align:center;white-space:nowrap}
  .ok{color:var(--ok);font-weight:700}
  .no{color:var(--faint)}
  .days{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .day{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
  .day.today{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .day h3{font-size:16px;padding:10px 14px;background:var(--surface-2);display:flex;justify-content:space-between}
  .day.today h3{background:var(--primary);color:var(--primary-ink)}
  .day .pic{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--faint);font-size:15px;overflow:hidden}
  .day .pic img{width:100%;height:100%;object-fit:cover}
  .day .act{display:flex;gap:6px;padding:10px;flex-wrap:wrap}
  .day .act label{cursor:pointer}
  .day .act input{display:none}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .opt{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:grid;gap:6px}
  .opt.on{border-color:var(--primary);background:var(--primary-soft)}
  .opt input{display:none}
  .opt b{font-size:17px}
  .opt ol{margin:0;padding-left:20px;font-size:15px;color:var(--muted)}
  .scr td{vertical-align:middle}
  .scr td:nth-child(3){white-space:nowrap}
  .scr tr.off td:not(.keep){opacity:.4}
  .scr tr.drag{opacity:.35}
  .scr tr.ab td{box-shadow:inset 0 3px 0 var(--primary)}
  .scr tr.bl td{box-shadow:inset 0 -3px 0 var(--primary)}
  .handle{cursor:grab;color:var(--faint);font-size:22px;line-height:1;user-select:none;padding:4px 6px;border-radius:6px}
  .handle:hover{background:var(--surface-2);color:var(--text)}
  .ord{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:15px}
  .secw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .secw input{width:64px;height:38px;border:1px solid var(--line-strong);border-radius:8px;text-align:center;font-size:17px;font-weight:600;background:var(--surface)}
  .secw button{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:20px;cursor:pointer}
  .secw button:hover{background:var(--surface-2)}
  .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-size:15px;font-weight:600}
  .sw input{display:none}
  .sw i{width:48px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;transition:background .15s}
  .sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
  .sw input:checked+i{background:var(--primary)}
  .sw input:checked+i::after{left:23px}
  .sw.lock{cursor:not-allowed;color:var(--muted)}
  .sw.lock i{background:var(--primary);opacity:.45}
  .sw.lock i::after{left:23px}
  .toast2{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1B2430;color:#fff;padding:12px 20px;border-radius:10px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast2.show{opacity:1}
  .drop{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border:2px dashed var(--line-strong);border-radius:14px;padding:24px;cursor:pointer;background:var(--surface-2);min-height:200px}
  .drop:not(.done){grid-template-columns:1fr;text-align:center;justify-items:center}
  .drop.over{border-color:var(--primary);background:var(--primary-soft)}
  .drop.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft);cursor:default}
  .drop img{width:320px;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
  .drop .dtx{display:grid;gap:10px;font-size:16px}
  .drop.done .dtx{text-align:left;justify-items:start}
  .drop:not(.done) .dtx{justify-items:center}
  .drop .dtx b{font-size:20px}
  .drop label input{display:none}
  .qrbox{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .qr{width:150px;height:150px;background:#fff;border-radius:8px;display:grid;place-items:center}
  .qr svg{width:150px;height:150px}
  .warn{margin:12px 0 0;padding:10px 14px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:15px}
</style>
</head>
<body>
<div class="top-a"><img src="assets/logo.svg" width="26" height="26" alt=""><b>티로드</b><span class="muted">· 급식소 현황판 · 영양사 입력</span><span class="grow"></span><span id="pbadge" hidden></span><b id="sch"></b><a class="btn pri" id="openTv" target="_blank" rel="noopener">현황판 열기 ↗</a></div>
<main class="wrap" id="m"><p class="muted">NEIS 급식 정보를 불러오고 있어요…</p></main>
<div class="toast2" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="assets/meal.js"></script>
<script>
(function () {
  var M = TR.meal, q = new URLSearchParams(location.search), S = q.get('s') || M.DEFAULT, FIXED = q.get('date');
  var root = document.getElementById('m'), data = null, set = M.settings(S);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function now() { return FIXED ? M.fromYmd(FIXED) : new Date(); }
  function hm(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  var tt; function toast(m) { var e = document.getElementById('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('show'); }, 1800); }
  function save(msg) { if (!M.saveSettings(S, set)) return toast('저장하지 못했어요 (브라우저 저장 공간이 막혀 있어요)'); toast(msg || '저장했어요 · 현황판에 바로 반영돼요'); }
  document.getElementById('openTv').href = 'tv.html?s=' + encodeURIComponent(S) + (FIXED ? '&date=' + FIXED : '');

  var SRC = { auto: '<span class="src auto">NEIS 자동</span>', me: '<span class="src me">영양사 입력</span>', rot: '<span class="src auto">자동 순환</span>' };

  function render() {
    set = M.settings(S);
    var today = M.ymd(now()), days = data.days;
    document.getElementById('sch').textContent = data.name;
    var badge = document.getElementById('pbadge');
    badge.hidden = !data.meals[today];
    badge.className = 'src ' + (M.photo(S, today) ? 'auto' : 'me');
    badge.textContent = M.photo(S, today) ? '오늘 사진 ✓ 올림' : '오늘 사진 아직';
    var scr = M.screens(set), onN = scr.filter(function (c) { return c.on; }), loop = onN.reduce(function (a, c) { return a + c.sec; }, 0);

    root.innerHTML =
      '<div class="page-h"><div><h1>급식소 현황판</h1><p>' + esc(data.name) + ' · NEIS 교육청 ' + esc(M.split(S).atpt) + ' / 학교 ' + esc(M.split(S).code) + ' · 현황판 주소 <b>goteacher.xyz/tv/' + esc(S) + '</b></p></div></div>' +
      '<div class="note">시연용 프로토타입이라 여기서 넣은 값은 <b>이 브라우저에만</b> 저장됩니다. 같은 PC에서 연 현황판에는 바로 반영됩니다. 실제 서비스에서는 티로드 서버에 저장되어 급식소 TV에 바로 뜹니다.</div>' +

      todayPhotoHtml(today) +
      '<section class="card"><div class="card-h"><h2>무엇이 자동이고, 무엇을 입력하나요</h2><div class="row"><span class="small muted">켜진 화면 ' + onN.length + '개 · 한 바퀴 ' + loop + '초</span><button class="btn sm" id="resetScr">처음 상태로</button></div></div><div class="card-b"><table class="t scr"><thead><tr><th></th><th class="c">순서</th><th>화면</th><th>보여 주는 것</th><th>출처</th><th>노출 시간</th><th>표시</th></tr></thead><tbody id="scrBody">' +
      scr.map(function (c, i) {
        return '<tr data-k="' + c.key + '" class="' + (c.on ? '' : 'off') + '"><td class="keep"><span class="handle" title="끌어서 순서 바꾸기">⋮⋮</span></td><td class="c"><span class="ord">' + (i + 1) + '</span></td><td><b>' + esc(c.name) + '</b></td><td>' + esc(c.what) + '</td><td>' + SRC[c.src] + '</td>' +
          '<td><span class="secw"><button type="button" data-dec="' + c.key + '" aria-label="1초 줄이기">−</button><input type="number" min="' + M.SEC_MIN + '" max="' + M.SEC_MAX + '" value="' + c.sec + '" data-sec="' + c.key + '"><span>초</span><button type="button" data-inc="' + c.key + '" aria-label="1초 늘리기">+</button></span></td>' +
          '<td class="keep">' + (c.lock ? '<span class="sw lock" title="당일 식판 사진은 규정상 매일 게시해야 해서 끌 수 없어요"><i></i>항상 켜짐</span>' : '<label class="sw"><input type="checkbox" data-on="' + c.key + '"' + (c.on ? ' checked' : '') + '><i></i>' + (c.on ? '켜짐' : '꺼짐') + '</label>') + '</td></tr>';
      }).join('') +
      '</tbody></table><p class="small muted" style="margin:12px 0 0">나이스에 식단을 올리면 나머지는 자동입니다. 영양사가 매일 할 일은 <b>식판 사진 한 장</b>뿐입니다. 왼쪽 ⋮⋮를 끌어 순서를 바꾸고, 화면마다 노출 시간(기본 ' + M.SEC + '초 · 원산지 14초 · 이번 주 12초, ' + M.SEC_MIN + '~' + M.SEC_MAX + '초)과 표시 여부를 정하면 현황판에 바로 반영됩니다.</p></div></section>' +

      '<section class="card"><div class="card-h"><h2>NEIS에서 받아 온 이번 주 급식</h2><span class="small muted">' + (data.stale ? '연결 안 됨 · ' + hm(data.at) + ' 저장본' : hm(data.at) + ' 불러옴') + '</span></div><div class="card-b"><table class="t"><thead><tr><th>날짜</th><th>메뉴</th><th class="c">칼로리</th><th class="c">알레르기</th><th class="c">영양</th><th class="c">원산지</th><th class="c">인원</th><th class="c">사진</th></tr></thead><tbody>' +
      days.map(function (d) {
        var w = M.label(d), x = data.meals[d], al = {};
        if (!x) return '<tr><td><b>' + w.m + '/' + w.d + ' ' + w.w + '</b></td><td colspan="7" class="no">NEIS에 식단 없음 (휴업일이거나 아직 안 올라옴)</td></tr>';
        x.dishes.forEach(function (m) { m.a.forEach(function (n) { al[n] = 1; }); });
        return '<tr><td><b>' + w.m + '/' + w.d + ' ' + w.w + '</b>' + (d === today ? ' <span class="src auto">오늘</span>' : '') + '</td><td>' + esc(x.dishes.map(function (m) { return m.n; }).join(' · ')) + '</td><td class="c">' + x.kcal + '</td><td class="c">' + Object.keys(al).length + '종</td><td class="c ok">' + x.nutr.length + '종</td><td class="c ok">' + x.origin.length + '종</td><td class="c">' + (x.count || '-') + '</td><td class="c">' + (M.photo(S, d) ? '<span class="ok">✓</span>' : '<span class="no">없음</span>') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '</div></section>' +

      '<section class="card"><div class="card-h"><h2>이번 주 식판 사진</h2><span class="small muted">늦게 올리거나 바꿀 때</span></div><div class="card-b"><div class="days">' +
      days.map(function (d) {
        var w = M.label(d), p = M.photo(S, d), has = !!data.meals[d];
        return '<div class="day' + (d === today ? ' today' : '') + '"><h3><span>' + w.w + ' ' + w.m + '/' + w.d + '</span><span>' + (d === today ? '오늘' : '') + '</span></h3><div class="pic">' + (p ? '<img src="' + p + '" alt="">' : has ? '사진 없음' : '급식 없음') + '</div>' +
          (has ? '<div class="act"><label class="btn sm pri">사진 올리기<input type="file" accept="image/*" capture="environment" data-up="' + d + '"></label>' + (p ? '<button class="btn sm" data-del="' + d + '">지우기</button>' : '') + '</div>' : '') + '</div>';
      }).join('') + '</div></div></section>' +

      '<section class="card"><div class="card-h"><h2>위생 교육 주제</h2><span class="small muted">기본은 자동 · 오늘은 “' + esc(M.hygiene[M.hygieneOf(today, {})].title) + '”</span></div><div class="card-b"><div class="opts">' +
      '<label class="opt' + (M.hygiene[set.hygiene] ? '' : ' on') + '"><input type="radio" name="hy" value=""' + (M.hygiene[set.hygiene] ? '' : ' checked') + '><b>자동 (날마다 바뀜)</b><span class="small muted">추천 · 다섯 주제가 하루씩 돌아가요</span><ol>' + Object.keys(M.hygiene).map(function (k) { return '<li>' + esc(M.hygiene[k].name) + '</li>'; }).join('') + '</ol></label>' +
      Object.keys(M.hygiene).map(function (k) { var h = M.hygiene[k], on = set.hygiene === k; return '<label class="opt' + (on ? ' on' : '') + '"><input type="radio" name="hy" value="' + k + '"' + (on ? ' checked' : '') + '><b>' + esc(h.title) + '</b><span class="small muted">' + esc(h.tag) + '</span><ol>' + h.items.map(function (i) { return '<li>' + esc(i[0]) + '</li>'; }).join('') + '</ol></label>'; }).join('') +
      '</div></div></section>' +

      '';

    bind();
  }

  // 오늘 사진: 누르기 · 끌어 놓기 · 붙여넣기(Ctrl+V) 세 가지로 올린다
  function todayPhotoHtml(today) {
    var w = M.label(today), has = !!data.meals[today], p = M.photo(S, today), at = M.photoAt(S, today);
    if (!has) return '<section class="card"><div class="card-b row" style="gap:14px"><b style="font-size:18px">오늘 식판 사진</b><span class="muted">' + w.m + '/' + w.d + ' ' + w.w + '요일은 NEIS에 급식이 없어 올릴 사진이 없어요.</span></div></section>';
    return '<section class="card"><div class="card-h"><h2>오늘 식판 사진 · ' + w.m + '/' + w.d + ' ' + w.w + '요일</h2><span class="small muted">매일 배식 전 · 당일 찍은 사진</span></div><div class="card-b"><div class="drop' + (p ? ' done' : '') + '" id="drop" tabindex="0">' +
      (p ? '<img src="' + p + '" alt="오늘 식판 사진"><div class="dtx"><b class="ok">✓ 올렸어요 · ' + hm(at || Date.now()).split(' ')[1] + '</b><span>현황판 7번 화면에 떠 있어요. 다른 사진으로 바꾸려면 여기에 다시 놓거나 붙여 넣으세요.</span><div class="row"><label class="btn">다른 사진으로 바꾸기<input type="file" accept="image/*" data-up="' + today + '"></label><button class="btn" data-del="' + today + '">지우기</button></div></div>'
        : '<div class="dtx"><b>여기를 눌러 사진을 고르거나, 사진 파일을 끌어다 놓으세요</b><span>휴대폰으로 찍은 사진을 카카오톡 PC ‘나에게 보내기’ 등에서 <b>복사한 뒤 이 화면에서 Ctrl+V</b> 해도 됩니다.</span><label class="btn pri" style="width:max-content">사진 고르기<input type="file" accept="image/*" data-up="' + today + '"></label></div>') +
      '</div>' + qrBox(today) + '<p class="warn" id="warn" hidden></p></div></section>';
  }
  // 폰으로 바로 올리기(PC 전용 원칙의 예외) — QR을 찍으면 그날 사진 올리기 화면이 열린다
  function photoUrl(d) { return new URL('meal-photo.html?s=' + encodeURIComponent(S) + '&d=' + d, location.href).href; }
  function qrBox(d) {
    var svg = '';
    try { var qr = qrcode(0, 'M'); qr.addData(photoUrl(d)); qr.make(); svg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { svg = '<span class="small muted">QR을 그리지 못했어요</span>'; }
    return '<div class="qrbox"><div class="qr">' + svg + '</div><div><b style="font-size:18px">📱 휴대폰으로 바로 올리기</b><p class="small muted" style="margin:6px 0 10px">휴대폰 카메라로 이 QR을 찍으면 오늘 사진 올리기 화면이 열려요. 찍고 [올리기] 두 번이면 끝납니다.</p><a class="btn sm" href="' + photoUrl(d) + '" target="_blank" rel="noopener">이 PC에서 열어 보기 ↗</a></div></div>';
  }

  function upPhoto(f, d) {
    if (!f || !/^image\//.test(f.type)) return toast('사진 파일만 올릴 수 있어요');
    var img = new Image(), url = URL.createObjectURL(f), taken = f.lastModified ? M.ymd(new Date(f.lastModified)) : d;
    img.onload = function () {
      // 저장 공간에 들어가도록 긴 변 1600px JPEG로 줄인다
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      if (!M.savePhoto(S, d, cv.toDataURL('image/jpeg', 0.82))) return toast('사진을 저장하지 못했어요 (브라우저 저장 공간 부족)');
      toast('사진을 올렸어요 · 현황판 7번 화면에 바로 떠요'); render();
      // 규정: 당일 사진. 파일 날짜가 급식 날짜와 다르면 알려 준다(막지는 않음)
      var wn = document.getElementById('warn');
      if (wn && taken !== d) { var t = M.label(taken), g = M.label(d); wn.hidden = false; wn.textContent = '사진 파일 날짜가 ' + t.m + '/' + t.d + '로 보여요. ' + g.m + '/' + g.d + ' 당일 찍은 사진이 맞는지 확인해 주세요. (휴대폰에서 옮기며 날짜가 바뀐 경우일 수도 있어요)'; }
    };
    img.src = url;
  }
  document.addEventListener('paste', function (e) {
    if (!data || e.target.matches('input[type=text],input:not([type]),input[type=number]')) return;
    var it = [].slice.call((e.clipboardData || {}).items || []).find(function (x) { return x.type.indexOf('image/') === 0; });
    if (it) { e.preventDefault(); upPhoto(it.getAsFile(), M.ymd(now())); }
  });

  function bind() {
    var dz = root.querySelector('#drop');
    if (dz) {
      dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
      dz.ondragleave = function () { dz.classList.remove('over'); };
      dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); upPhoto(e.dataTransfer.files[0], M.ymd(now())); };
      dz.onclick = function (e) { if (!dz.classList.contains('done') && !e.target.closest('label,button')) dz.querySelector('input[type=file]').click(); };
    }
    bindScreens();
    root.querySelectorAll('[data-up]').forEach(function (inp) { inp.onchange = function () { upPhoto(this.files && this.files[0], this.dataset.up); this.value = ''; }; });
    root.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { M.savePhoto(S, b.dataset.del, null); toast('사진을 지웠어요'); render(); }; });
    root.querySelectorAll('input[name=hy]').forEach(function (r) { r.onchange = function () { if (r.value) set.hygiene = r.value; else delete set.hygiene; save(r.value ? '위생 교육 주제를 고정했어요' : '위생 교육 주제를 자동으로 돌려요'); render(); }; });
  }

  // 화면 순서(끌어 놓기) · 노출 시간 · 켜고 끄기
  function bindScreens() {
    var body = root.querySelector('#scrBody'), dragK = null;
    function order() { return [].map.call(body.children, function (tr) { return tr.dataset.k; }); }
    function setSec(k, v) {
      v = Math.round(+v); if (!(v >= M.SEC_MIN)) v = M.SEC_MIN; if (v > M.SEC_MAX) v = M.SEC_MAX;
      var def = M.screens({}).find(function (x) { return x.key === k; }).def;
      if (v === def) delete set.sec[k]; else set.sec[k] = v;
      save(M.SCREENS.find(function (x) { return x.key === k; }).name + ' 화면을 ' + v + '초 동안 보여 줘요'); render();
    }
    body.querySelectorAll('.handle').forEach(function (h) {
      var tr = h.closest('tr');
      h.onmousedown = function () { tr.draggable = true; };
      tr.ondragstart = function (e) { dragK = tr.dataset.k; tr.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragK); };
      tr.ondragend = function () { tr.draggable = false; tr.classList.remove('drag'); body.querySelectorAll('tr').forEach(function (x) { x.classList.remove('ab', 'bl'); }); };
    });
    body.querySelectorAll('tr').forEach(function (tr) {
      tr.ondragover = function (e) {
        if (!dragK || tr.dataset.k === dragK) return; e.preventDefault();
        var r = tr.getBoundingClientRect(), below = e.clientY > r.top + r.height / 2;
        body.querySelectorAll('tr').forEach(function (x) { x.classList.remove('ab', 'bl'); });
        tr.classList.add(below ? 'bl' : 'ab');
      };
      tr.ondrop = function (e) {
        e.preventDefault(); if (!dragK || tr.dataset.k === dragK) return;
        var o = order().filter(function (k) { return k !== dragK; }), i = o.indexOf(tr.dataset.k) + (tr.classList.contains('bl') ? 1 : 0);
        o.splice(i, 0, dragK); set.order = o; dragK = null; save('화면 순서를 바꿨어요'); render();
      };
    });
    body.querySelectorAll('[data-sec]').forEach(function (i) { i.onchange = function () { setSec(i.dataset.sec, i.value); }; });
    function cur(k) { return M.screens(set).find(function (x) { return x.key === k; }).sec; }
    body.querySelectorAll('[data-dec]').forEach(function (b) { b.onclick = function () { setSec(b.dataset.dec, cur(b.dataset.dec) - 1); }; });
    body.querySelectorAll('[data-inc]').forEach(function (b) { b.onclick = function () { setSec(b.dataset.inc, cur(b.dataset.inc) + 1); }; });
    body.querySelectorAll('[data-on]').forEach(function (c) {
      c.onchange = function () {
        var k = c.dataset.on, on = M.screens(set).filter(function (x) { return x.on; });
        if (!c.checked && on.length <= 1) { c.checked = true; return toast('화면은 하나 이상 켜 두어야 해요'); }
        if (c.checked) delete set.off[k]; else set.off[k] = true;
        save(M.SCREENS.find(function (x) { return x.key === k; }).name + ' 화면을 ' + (c.checked ? '켰어요' : '껐어요')); render();
      };
    });
    root.querySelector('#resetScr').onclick = function () { delete set.order; set.sec = {}; set.off = {}; save('화면 순서 · 시간 · 표시를 처음 상태로 되돌렸어요'); render(); };
  }

  function load() {
    M.load(S, q.get('key'), M.monday(now())).then(function (d) { data = d; render(); })
      .catch(function (e) { root.innerHTML = '<div class="note">NEIS 급식 정보를 불러오지 못했어요: ' + esc(e.message || e) + '</div>'; });
  }
  load();
})();
</script>
</body>
</html>
