<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>급식소 현황판</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 1920×1080 무대 하나를 TV 화면 크기에 맞춰 늘리고 줄인다. 급식실은 밝아서 늘 밝은 화면. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0B1416;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  h1,h2{margin:0}
  body.idle{cursor:none}
  .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#F7F8FA;color:#1B2430;display:grid;grid-template-rows:116px 1fr 104px;overflow:hidden;line-height:1.3;word-break:keep-all}
  .tv-h{display:flex;align-items:center;gap:22px;padding:0 64px;background:#0F6E6E;color:#fff}
  .tv-h img{width:52px;height:52px;background:#fff;border-radius:14px;padding:6px}
  .tv-h .sch{font-size:40px;font-weight:700;letter-spacing:-.02em}
  .tv-h .sch small{font-size:32px;font-weight:500;opacity:.8;margin-left:12px}
  .tv-h .when{margin-left:auto;font-size:36px;font-weight:600;display:flex;align-items:center;gap:28px}
  .tv-h .clock{font-size:48px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 22px;border-radius:14px}

  .pages{position:relative;overflow:hidden}
  .pg{position:absolute;inset:0;padding:44px 64px 40px;display:flex;flex-direction:column;opacity:0;transform:translateX(40px);transition:opacity .6s ease,transform .6s ease;pointer-events:none;--k:#0F6E6E;--k-soft:#E3F1F0}
  .pg.on{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){.pg{transition:none;transform:none}}
  .pg-h{display:flex;align-items:baseline;gap:28px;margin-bottom:32px;flex:none}
  .pg-h h1{font-size:76px;line-height:1.1;font-weight:800;letter-spacing:-.03em;color:var(--k)}
  .pg-h p{margin:0;font-size:36px;color:#5B6675;font-weight:500}
  .pg-h .tag{font-size:30px;font-weight:700;padding:6px 20px;border-radius:999px;background:var(--k-soft);color:var(--k)}
  .pg-h .nx{font-size:30px;font-weight:700;padding:6px 20px;border-radius:999px;background:#FFF4D6;color:#8A5A00;align-self:center}
  .empty{flex:1;display:grid;place-content:center;text-align:center;gap:12px;font-size:56px;font-weight:800;color:#5B6675}
  .empty small{font-size:34px;font-weight:500}

  /* 1 오늘의 메뉴 */
  .menu{display:grid;grid-template-columns:1fr 470px;gap:44px;flex:1;min-height:0}
  .menu ul{margin:0;list-style:none;display:grid;grid-auto-rows:1fr;background:#fff;border-radius:32px;box-shadow:0 2px 8px rgba(16,24,40,.08);padding:12px 48px;min-height:0}
  .menu li{display:flex;align-items:center;gap:20px;border-top:2px solid #E2E6EB;min-height:0;white-space:nowrap}
  .menu li:first-child{border-top:0}
  .menu li b{font-weight:700;letter-spacing:-.03em}
  .self{font-style:normal;font-size:26px;font-weight:700;color:#0F6E6E;background:#E3F1F0;border-radius:10px;padding:2px 12px}
  .al{display:flex;gap:8px}
  .al span{min-width:48px;height:48px;padding:0 8px;border-radius:24px;background:#FCE6EE;color:#B4235A;font-size:28px;font-weight:700;display:grid;place-items:center}
  .side{display:grid;gap:24px;grid-template-rows:repeat(3,1fr);min-height:0}
  .big{border-radius:28px;padding:24px 40px;display:flex;flex-direction:column;justify-content:center}
  .big .l{font-size:32px;font-weight:600;opacity:.85}
  .big .v{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
  .big .v small{font-size:42px;font-weight:700;margin-left:8px}

  /* 2 알레르기 */
  .alg{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:16px;flex:1;min-height:0}
  .alg>div{border-radius:24px;background:#EEF0F3;color:#A0A8B4;padding:10px 24px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
  .alg .nm{display:flex;align-items:center;gap:16px;font-size:44px;font-weight:700}
  .alg .nm i{font-style:normal;width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;flex:none}
  .alg .in{font-size:25px;margin-top:4px;line-height:1.25}
  .alg>div.has{background:#FCE6EE;color:#8A1C45;box-shadow:inset 0 0 0 4px #D6336C}
  .alg>div.has .nm i{background:#D6336C;color:#fff}

  /* 3 칼로리·영양 */
  .cal{display:grid;grid-template-columns:560px 1fr;gap:56px;flex:1;min-height:0;align-items:center}
  .ring{position:relative;width:540px;height:540px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .c b{font-size:150px;line-height:1;font-weight:800;letter-spacing:-.05em;color:#C2580A}
  .ring .c span{font-size:44px;font-weight:700;color:#C2580A}
  .ring .c small{font-size:30px;color:#5B6675;margin-top:10px}
  .nt{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .nt>div{background:#fff;border-radius:24px;padding:22px 30px;box-shadow:0 2px 8px rgba(16,24,40,.07)}
  .nt .n{font-size:32px;font-weight:700;color:#5B6675}
  .nt .v{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
  .nt .v small{font-size:28px;font-weight:600;color:#5B6675;margin-left:6px}
  .nt .b{font-size:24px;color:#5B6675;margin-top:4px}
  .nt .bar{height:12px;border-radius:6px;background:#EEF0F3;margin-top:8px;overflow:hidden}
  .nt .bar i{display:block;height:100%;background:#F0A060;border-radius:6px}

  /* 4 원산지 */
  .org{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,1fr);grid-auto-flow:column;gap:12px 24px;flex:1;min-height:0}
  .org>div{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:16px;padding:0 24px;box-shadow:0 1px 4px rgba(16,24,40,.07);min-height:0}
  .org .p{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .org .o{font-size:30px;font-weight:800;color:var(--k);white-space:nowrap}
  .org .o.im{color:#C2580A}

  /* 5 위생 교육 */
  .wash{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:28px;flex:1;min-height:0}
  .wash>div{min-height:0;background:#fff;border-radius:32px;padding:32px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;box-shadow:0 2px 8px rgba(16,24,40,.07);border-top:14px solid var(--k)}
  .wash .hd{display:flex;align-items:center;gap:20px}
  .wash i{font-style:normal;width:84px;height:84px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-size:52px;font-weight:800;flex:none}
  .wash b{font-size:52px;font-weight:800;letter-spacing:-.02em}
  .wash span{font-size:34px;line-height:1.35;color:#3D4654}

  /* 6 골고루 */
  .grp{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:24px;flex:1;min-height:0}
  .grp>div{border-radius:28px;padding:26px 34px;display:flex;flex-direction:column;gap:8px;background:var(--g-soft);border:4px solid transparent;min-height:0;overflow:hidden}
  .grp>div.has{border-color:var(--g)}
  .grp .gn{font-size:42px;font-weight:800;color:var(--g);letter-spacing:-.02em}
  .grp .gd{font-size:28px;font-weight:600;color:#3D4654}
  .grp .gt{margin-top:auto;font-size:36px;font-weight:700;line-height:1.25}
  .grp .gt.none{font-size:30px;font-weight:600;color:#5B6675}
  .grp .ck{float:right;font-size:30px;font-weight:800;color:#fff;background:var(--g);border-radius:999px;padding:2px 18px}
  .slogan{margin-top:22px;text-align:center;font-size:44px;font-weight:800;color:#2F9E44;flex:none}

  /* 7 오늘의 식사 사진 */
  .ph{display:grid;grid-template-columns:1240px 1fr;gap:48px;flex:1;min-height:0}
  .ph .fr{position:relative;border-radius:32px;overflow:hidden;background:#E9DCC8;box-shadow:0 6px 24px rgba(16,24,40,.18)}
  .ph .fr img,.ph .fr svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph .wait{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:52px;font-weight:800;color:#5B4A33;gap:10px}
  .ph .wait small{font-size:32px;font-weight:500}
  .ph ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;align-content:center}
  .ph li{font-weight:700;display:flex;align-items:center;gap:18px;letter-spacing:-.02em;white-space:nowrap}
  .ph li::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--k);flex:none}
  .ph .kc{margin-top:20px;font-size:44px;font-weight:800;color:#C2580A}

  /* 8 이번 주 */
  .wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;flex:1;min-height:0}
  .wk section{background:#fff;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(16,24,40,.07);min-height:0}
  .wk h2{font-size:46px;font-weight:800;padding:18px 30px;background:#EEF0F3;display:flex;align-items:baseline;justify-content:space-between}
  .wk h2 small{font-size:30px;font-weight:600;color:#5B6675}
  .wk ul{margin:0;padding:16px 26px;list-style:none;display:grid;gap:8px;flex:1;align-content:start;min-height:0}
  .wk li{font-size:31px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
  .wk li sup{display:inline-block;font-size:20px;color:#B4235A;font-weight:700;margin-left:4px;vertical-align:8px;letter-spacing:0}
  .wk .no{color:#8A94A3;font-size:32px;padding:16px 26px;flex:1}
  .wk .kc{padding:14px 30px;font-size:32px;font-weight:700;color:#C2580A;border-top:2px solid #E2E6EB}
  .wk section.today{box-shadow:0 0 0 6px var(--k),0 8px 24px rgba(16,24,40,.15)}
  .wk section.today h2{background:var(--k);color:#fff}
  .wk section.today h2 small{color:#fff;opacity:.85}

  /* 아래 진행 표시 */
  .tv-f{display:flex;align-items:center;gap:14px;padding:0 64px;background:#fff;border-top:2px solid #E2E6EB}
  .tv-f .st{position:relative;flex:1;height:64px;border-radius:16px;background:#EEF0F3;color:#5B6675;font-size:27px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .tv-f .st b{font-weight:800;margin-right:8px}
  .tv-f .st span{position:relative}
  .tv-f .st i{position:absolute;left:0;top:0;bottom:0;width:0;background:#B9DCD9}
  .tv-f .st.on{color:#0B4F4F}
  .tv-f .st.on i{animation:fill var(--dur) linear forwards}
  .tv-f .st.on.paused i{animation-play-state:paused}
  .tv-f .st.done{color:#0F6E6E}
  @keyframes fill{to{width:100%}}
  .tv-f .src{font-size:22px;color:#8A94A3;margin-left:8px;white-space:nowrap;text-align:right;line-height:1.35}
  .tv-f .src.bad{color:#C2410C}

  .boot{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:48px;font-weight:700;color:#5B6675;gap:14px}
  .boot small{font-size:30px;font-weight:500}

  /* 조작 막대 — 마우스를 움직일 때만, 화면 크기 그대로 */
  .ctl{position:fixed;right:20px;top:20px;display:flex;gap:8px;padding:10px;border-radius:14px;background:rgba(17,20,24,.88);transition:opacity .3s;z-index:5}
  body.idle .ctl{opacity:0;pointer-events:none}
  .ctl button,.ctl a{height:44px;padding:0 16px;border:0;border-radius:10px;background:#2A313A;color:#E6EAF0;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .ctl button:hover,.ctl a:hover{background:#3A434F}
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="tv-h"><img src="assets/logo.svg" alt=""><div class="sch" id="sch"></div><div class="when"><span id="date"></span><span class="clock" id="clock"></span></div></header>
  <main class="pages" id="pages"><div class="boot">급식 정보를 불러오고 있어요<small>NEIS 급식식단정보</small></div></main>
  <footer class="tv-f" id="foot"></footer>
</div>
<div class="ctl" id="ctl">
  <button id="prev">◀ 이전</button><button id="pause">❚❚ 멈춤</button><button id="next">다음 ▶</button>
  <a id="admin" target="_blank" rel="noopener">영양사 입력 ↗</a><button id="fs">전체 화면</button>
</div>
<script src="assets/meal.js"></script>
<script>
(function () {
  var M = TR.meal, q = new URLSearchParams(location.search);
  var S = q.get('s') || M.DEFAULT, FIXED = q.get('date'); // ?date=20261026 으로 그날처럼 보기
  var SEC = 7, DUR = SEC * 1000, REFRESH = 30 * 60 * 1000;
  var data = null, set = M.settings(S);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function now() { return FIXED ? M.fromYmd(FIXED) : new Date(); }
  function hm(t) { var d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function al(a) { return a.length ? '<span class="al">' + a.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</span>' : ''; }
  $('#admin').href = 'meal-admin.html?s=' + encodeURIComponent(S);

  function tick() { var t = M.label(M.ymd(now())); $('#clock').textContent = hm(Date.now()); $('#date').textContent = t.m + '월 ' + t.d + '일 ' + t.w + '요일'; }
  tick(); setInterval(tick, 10000);

  // 보여 줄 하루 = 오늘 급식, 없으면(주말·휴일) 이번 주 안의 다음 급식
  function pick() {
    var today = M.ymd(now()), ds = data.days.filter(function (d) { return d >= today && data.meals[d]; });
    return ds.length ? ds[0] : null;
  }

  var emptyTray = '<svg viewBox="0 0 1240 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1240" height="900" fill="#E9DCC8"/><rect x="70" y="90" width="1100" height="720" rx="70" fill="#DCE3EA" stroke="#C3CBD5" stroke-width="8"/>' +
    [0, 1, 2, 3].map(function (i) { return '<rect x="' + (120 + i * 255) + '" y="140" width="235" height="270" rx="40" fill="#EEF2F6"/>'; }).join('') +
    '<rect x="120" y="440" width="490" height="320" rx="48" fill="#EEF2F6"/><rect x="640" y="440" width="480" height="320" rx="48" fill="#EEF2F6"/></svg>';

  function pages() {
    var dy = pick(), meal = dy && data.meals[dy], t = dy && M.label(dy), today = M.ymd(now()), isToday = dy === today;
    var when = !dy ? '' : isToday ? '오늘' : t.m + '월 ' + t.d + '일(' + t.w + ')';
    var nx = dy && !isToday ? '<span class="nx">다음 급식 · ' + t.m + '/' + t.d + ' ' + t.w + '요일</span>' : '';
    var nextWk = data.days[0] > today;
    var none = '<div class="empty">' + (nextWk ? '다음 주 급식 정보가 아직 없어요' : '이번 주에는 급식 정보가 없어요') + '<small>방학·휴업일이거나 아직 NEIS에 올라오지 않았어요</small></div>';
    var used = {};
    if (meal) meal.dishes.forEach(function (d) { d.a.forEach(function (n) { (used[n] = used[n] || []).push(d.n); }); });
    var usedN = Object.keys(used).length;
    var hy = M.hygiene[set.hygiene] || M.hygiene.wash;
    var base = set.base || {};

    return [
      { key: 'menu', label: '오늘의 메뉴', k: '#0F6E6E', ks: '#E3F1F0', html: function () {
        if (!meal) return '<div class="pg-h"><h1>오늘의 메뉴</h1></div>' + none;
        var n = meal.dishes.length, fsBase = n <= 5 ? 76 : n <= 6 ? 70 : n <= 7 ? 62 : 56;
        return '<div class="pg-h"><h1>' + (isToday ? '오늘의 메뉴' : '다음 급식 메뉴') + '</h1><p>' + t.m + '월 ' + t.d + '일 ' + t.w + '요일 점심</p>' + nx + '</div><div class="menu"><ul>' +
          meal.dishes.map(function (d) {
            var extra = d.a.length * 56 + (d.self ? 100 : 0), fs = Math.max(38, Math.min(fsBase, Math.floor((1180 - 96 - extra) / Math.max(d.n.length, 1))));
            return '<li><b style="font-size:' + fs + 'px">' + esc(d.n) + '</b>' + (d.self ? '<em class="self">자율</em>' : '') + al(d.a) + '</li>';
          }).join('') + '</ul>' +
          '<div class="side"><div class="big" style="background:#FDEEE2;color:#9A3F06"><div class="l">칼로리</div><div class="v">' + meal.kcal + '<small>kcal</small></div></div>' +
          '<div class="big" style="background:#FCE6EE;color:#8A1C45"><div class="l">알레르기 유발 식품</div><div class="v">' + usedN + '<small>가지</small></div></div>' +
          '<div class="big" style="background:#E3F1F0;color:#0B4F4F"><div class="l">함께 먹는 사람</div><div class="v">' + (meal.count || '-') + '<small>명</small></div></div></div></div>';
      } },
      { key: 'allergy', label: '알레르기', k: '#D6336C', ks: '#FCE6EE', html: function () {
        if (!meal) return '<div class="pg-h"><h1>알레르기 정보</h1></div>' + none;
        return '<div class="pg-h"><h1>알레르기 정보</h1><p>' + when + ' 들어간 식품은 <b style="color:#D6336C">분홍색</b> · 해당 학생은 배식 전에 꼭 말해 주세요</p></div><div class="alg">' +
          M.allergens.map(function (nm, i) { var u = used[i + 1]; return '<div class="' + (u ? 'has' : '') + '"><div class="nm"><i>' + (i + 1) + '</i>' + esc(nm) + '</div>' + (u ? '<div class="in">' + esc(u.join(' · ')) + '</div>' : '') + '</div>'; }).join('') + '</div>';
      } },
      { key: 'cal', label: '칼로리', k: '#C2580A', ks: '#FDEEE2', html: function () {
        if (!meal) return '<div class="pg-h"><h1>칼로리 · 영양 정보</h1></div>' + none;
        var r = 240, c = 2 * Math.PI * r, kb = +base['에너지'] || 0, pct = kb ? Math.min(meal.kcal / kb, 1) : 1;
        return '<div class="pg-h"><h1>칼로리 · 영양 정보</h1><p>' + when + ' 점심 한 끼' + (kb ? ' · 우리 학교 기준과 비교' : '') + '</p>' + nx + '</div><div class="cal">' +
          '<div class="ring"><svg viewBox="0 0 540 540"><circle cx="270" cy="270" r="' + r + '" fill="none" stroke="#FDEEE2" stroke-width="40"/><circle cx="270" cy="270" r="' + r + '" fill="none" stroke="#F08C00" stroke-width="40" stroke-linecap="round" stroke-dasharray="' + (c * pct).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' +
          '<div class="c"><b>' + meal.kcal + '</b><span>kcal</span>' + (kb ? '<small>기준 ' + kb + ' kcal</small>' : '') + '</div></div>' +
          '<div class="nt">' + meal.nutr.map(function (x) {
            var b = +base[x.n] || 0;
            return '<div><div class="n">' + esc(x.n) + '</div><div class="v">' + x.v + '<small>' + esc(x.u) + '</small></div>' +
              (b ? '<div class="bar"><i style="width:' + Math.min(100, x.v / b * 100).toFixed(0) + '%"></i></div><div class="b">기준 ' + b + ' · ' + Math.round(x.v / b * 100) + '%</div>' : '') + '</div>';
          }).join('') + '</div></div>';
      } },
      { key: 'origin', label: '원산지', k: '#3B5BDB', ks: '#E8EDFD', html: function () {
        if (!meal) return '<div class="pg-h"><h1>원산지 정보</h1></div>' + none;
        var o = meal.origin, rows = Math.ceil(o.length / 4);
        return '<div class="pg-h"><h1>원산지 정보</h1><p>우리 학교 급식 재료 · 국내산이 아닌 재료는 <b style="color:#C2580A">주황색</b></p></div><div class="org" style="grid-template-rows:repeat(' + rows + ',minmax(0,1fr))">' +
          o.map(function (x) { return '<div><span class="p">' + esc(x[0]) + '</span><span class="o' + (/국내산/.test(x[1]) ? '' : ' im') + '">' + esc(x[1]) + '</span></div>'; }).join('') + '</div>';
      } },
      { key: 'hygiene', label: hy.name, k: '#1C7ED6', ks: '#E3F0FC', html: function () {
        return '<div class="pg-h"><h1>' + esc(hy.title) + '</h1><span class="tag">' + esc(hy.tag) + '</span></div><div class="wash">' +
          hy.items.map(function (w, i) { return '<div><div class="hd"><i>' + (i + 1) + '</i><b>' + esc(w[0]) + '</b></div><span>' + esc(w[1]) + '</span></div>'; }).join('') + '</div>';
      } },
      { key: 'eat', label: '골고루', k: '#2F9E44', ks: '#E5F6E8', html: function () {
        var slogan = '<div class="slogan">' + esc(set.slogan || M.SLOGAN) + '</div>';
        if (!meal) return '<div class="pg-h"><h1>골고루 먹어요</h1></div>' + none;
        return '<div class="pg-h"><h1>골고루 먹어요</h1><p>' + when + ' 식판에는 어떤 식품이 들어 있을까요?</p></div><div class="grp">' +
          M.groups.map(function (g) {
            var ds = meal.dishes.filter(function (d) { return M.groupsOf(d.n, set).indexOf(g.id) >= 0; }).map(function (d) { return d.n; });
            var nothing = g.id === 'milk' ? '없어요 · 우유 한 컵 더 마셔요' : g.id === 'fat' ? '조금만 들어 있어요' : '이번에는 없어요';
            return '<div class="' + (ds.length ? 'has' : '') + '" style="--g:' + g.color + ';--g-soft:' + g.soft + '"><div class="gn">' + (ds.length ? '<span class="ck">✓</span>' : '') + esc(g.name) + '</div><div class="gd">' + esc(g.does) + ' · ' + esc(g.ex) + '</div>' +
              '<div class="gt' + (ds.length ? '' : ' none') + '">' + esc(ds.length ? ds.join(' · ') : nothing) + '</div></div>';
          }).join('') + '</div>' + slogan;
      } },
      { key: 'photo', label: '오늘의 식사', k: '#0F6E6E', ks: '#E3F1F0', html: function () {
        if (!meal) return '<div class="pg-h"><h1>오늘의 식사</h1></div>' + none;
        var p = M.photo(S, dy), n = meal.dishes.length, fs = n <= 6 ? 54 : n <= 7 ? 48 : 42;
        return '<div class="pg-h"><h1>' + (isToday ? '오늘의 식사' : '다음 급식') + '</h1><p>' + t.m + '월 ' + t.d + '일 점심은 이렇게 나와요</p></div><div class="ph"><div class="fr">' +
          (p ? '<img src="' + p + '" alt="점심 식판 사진">' : emptyTray + '<div class="wait">사진을 준비하고 있어요<small>배식 전에 영양 선생님이 올려 주세요</small></div>') + '</div>' +
          '<div><ul>' + meal.dishes.map(function (d) { return '<li style="font-size:' + Math.min(fs, Math.floor(560 / Math.max(d.n.length, 1))) + 'px">' + esc(d.n) + '</li>'; }).join('') + '</ul><div class="kc">' + meal.kcal + ' kcal</div></div></div>';
      } },
      { key: 'week', label: '이번 주 메뉴', k: '#8A5CF6', ks: '#F0EAFE', html: function () {
        var a = M.label(data.days[0]), b = M.label(data.days[4]);
        return '<div class="pg-h"><h1>' + (data.days[0] > M.ymd(now()) ? '다음 주 급식' : '이번 주 급식') + '</h1><p>' + a.m + '/' + a.d + ' ~ ' + b.m + '/' + b.d + ' · 작은 숫자는 알레르기 번호</p></div><div class="wk">' +
          data.days.map(function (d) {
            var w = M.label(d), x = data.meals[d], on = d === today;
            return '<section class="' + (on ? 'today' : '') + '"><h2>' + w.w + '<small>' + w.m + '/' + w.d + (on ? ' 오늘' : '') + '</small></h2>' +
              (x ? '<ul>' + x.dishes.map(function (m) { return '<li>' + esc(m.n) + (m.a.length ? '<sup>' + m.a.join('.') + '</sup>' : '') + '</li>'; }).join('') + '</ul><div class="kc">' + x.kcal + ' kcal</div>' : '<div class="no">급식 없음</div>') + '</section>';
          }).join('') + '</div>';
      } }
    ];
  }

  var pagesEl = $('#pages'), footEl = $('#foot'), PAGES = [], pgs = [], sts = [];
  var cur = Math.max(0, Math.min(7, (+q.get('p') || 1) - 1)), timer = null, paused = false, startedAt = 0, left = DUR;

  function render() {
    set = M.settings(S);
    PAGES = pages();
    $('#sch').innerHTML = esc(data.name || '학교') + '<small>급식소</small>';
    pagesEl.innerHTML = PAGES.map(function (p) { return '<section class="pg" style="--k:' + p.k + ';--k-soft:' + p.ks + '" data-k="' + p.key + '">' + p.html() + '</section>'; }).join('');
    footEl.style.setProperty('--dur', SEC + 's');
    footEl.innerHTML = PAGES.map(function (p, i) { return '<div class="st"><i></i><span><b>' + (i + 1) + '</b>' + esc(p.label) + '</span></div>'; }).join('') +
      '<span class="src' + (data.stale ? ' bad' : '') + '">' + (data.stale ? 'NEIS 연결 안 됨<br>' + hm(data.at) + ' 저장본' : 'NEIS 급식 연동<br>' + hm(data.at) + ' 불러옴') + '</span>';
    pgs = pagesEl.children; sts = footEl.querySelectorAll('.st');
    show(cur);
  }
  function show(i) {
    if (!PAGES.length) return;
    cur = (i + PAGES.length) % PAGES.length;
    for (var j = 0; j < pgs.length; j++) {
      pgs[j].classList.toggle('on', j === cur);
      sts[j].classList.remove('on', 'paused'); sts[j].classList.toggle('done', j < cur);
    }
    void sts[cur].offsetWidth; // 진행 막대 애니메이션을 처음부터 다시
    sts[cur].classList.add('on'); if (paused) sts[cur].classList.add('paused');
    left = DUR; schedule();
  }
  function schedule() { clearTimeout(timer); if (paused) return; startedAt = Date.now(); timer = setTimeout(function () { show(cur + 1); }, left); }
  function togglePause() {
    paused = !paused;
    if (paused) { clearTimeout(timer); left -= Date.now() - startedAt; } else schedule();
    if (sts[cur]) sts[cur].classList.toggle('paused', paused);
    $('#pause').textContent = paused ? '▶ 계속' : '❚❚ 멈춤';
  }

  // 불러오기: 처음, 30분마다, 날짜가 바뀌면. 실패하면 1분 뒤 다시.
  var loadedFor = '', retry = null;
  function load() {
    clearTimeout(retry); loadedFor = M.ymd(now());
    M.load(S, q.get('key') || M.settings(S).key, M.monday(now())).then(function (d) { data = d; render(); }).catch(function (e) {
      if (!data) pagesEl.innerHTML = '<div class="boot">NEIS 급식 정보를 불러오지 못했어요<small>' + esc(e.message || e) + ' · 1분 뒤 다시 시도해요</small></div>';
      retry = setTimeout(load, 60 * 1000);
    });
  }
  load(); setInterval(load, REFRESH);
  setInterval(function () { if (M.ymd(now()) !== loadedFor) load(); }, 60 * 1000);
  // 같은 브라우저의 영양사 입력 화면에서 저장하면 바로 반영
  addEventListener('storage', function (e) { if (data && e.key && e.key.indexOf('troad.meal.') === 0 && e.key.indexOf('.cache.') < 0) render(); });

  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  $('#prev').onclick = function () { show(cur - 1); };
  $('#next').onclick = function () { show(cur + 1); };
  $('#pause').onclick = togglePause;
  $('#fs').onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); };
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'f' || e.key === 'F') $('#fs').click();
  });
  var idleT; function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000); }
  addEventListener('mousemove', wake); wake();
})();
</script>
</body>
</html>
