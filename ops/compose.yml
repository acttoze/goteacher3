# 고티처 스테이징(t.goteacher.xyz). 서버: /home/ubuntu/prod/goteacher/ops 에서
#   docker compose up -d --build
# 공용 서버다. 이 프로젝트(goteacher) 밖의 컨테이너·네트워크·볼륨은 건드리지 않는다.
# Traefik 값(네트워크 infra · 진입점 web/websecure · 리졸버 letsencrypt)은
# 2026-10-30 서버의 traefik 컨테이너 inspect로 읽어 확인한 값이다.
name: goteacher

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # 서비스 이름이 infra 네트워크의 DNS 별칭이 되므로 겹치지 않게 goteacher-app으로 둔다.
  goteacher-app:
    <<: *common
    build: { context: .., dockerfile: ops/Dockerfile }
    image: goteacher-app:latest
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - media:/srv/media  # 올린 한글 파일(E2). worker와 공유
      # P1 구 아이디 예약 목록(서버에만, 커밋 안 함). .env의 RESERVED_IDS_FILE=/srv/reserved/ids.txt. 가입 뷰만 읽어 worker엔 없음.
      # 폴더가 없으면 docker가 빈 폴더를 만든다 → 파일 없음 = 예약 꺼짐. P3 이관 뒤 이 줄과 폴더를 지운다
      - ./reserved:/srv/reserved:ro
    mem_limit: 1g  # gthread 8슬롯 + 사진 재인코딩 여유(동시 재인코딩 수는 앱이 제한)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s  # 배포 때 up --wait가 빨리 끝나게(B2)
    networks: [default, infra]
    labels:
      traefik.enable: "true"
      traefik.docker.network: infra
      # 본문은 Traefik이 다 받은 뒤 앱에 넘긴다(느린 본문이 gthread 슬롯을 쥐지 못하게). 라우터 4개로 나눈다:
      #   gt-staging: GET·HEAD. 버퍼링 없음 — buffering은 응답도 쌓으므로 내려받기를 공용 디스크에 두지 않는다
      #   gt-staging-body: 그 밖의 메서드, 3MB(앱 DATA_UPLOAD_MAX 3MB + 머리 몫)
      #   gt-staging-up101·up31·up9: 파일을 받는 POST만. 상한은 앱과 같게
      # 인증 전에 받으므로 업로드 라우터는 동시 건수를 묶어 공용 디스크에 쌓이는 양을 제한한다(합계 약 1.2GB). ops/README.md
      traefik.http.routers.gt-staging.rule: Host(`t.goteacher.xyz`) && (Method(`GET`) || Method(`HEAD`))
      traefik.http.routers.gt-staging.entrypoints: websecure
      traefik.http.routers.gt-staging.tls: "true"
      traefik.http.routers.gt-staging.tls.certresolver: letsencrypt
      traefik.http.routers.gt-staging.service: gt-staging
      traefik.http.routers.gt-staging-body.rule: Host(`t.goteacher.xyz`) && !Method(`GET`) && !Method(`HEAD`)
      traefik.http.routers.gt-staging-body.entrypoints: websecure
      traefik.http.routers.gt-staging-body.tls: "true"
      traefik.http.routers.gt-staging-body.tls.certresolver: letsencrypt
      traefik.http.routers.gt-staging-body.service: gt-staging
      traefik.http.routers.gt-staging-body.middlewares: gt-staging-buf3
      # 공지 쓰기·고치기
      traefik.http.routers.gt-staging-up101.rule: Host(`t.goteacher.xyz`) && Method(`POST`) && PathRegexp(`^/s/[^/]+/board/(new|[^/]+/edit)$$`)
      traefik.http.routers.gt-staging-up101.priority: "1000"
      traefik.http.routers.gt-staging-up101.entrypoints: websecure
      traefik.http.routers.gt-staging-up101.tls: "true"
      traefik.http.routers.gt-staging-up101.tls.certresolver: letsencrypt
      traefik.http.routers.gt-staging-up101.service: gt-staging
      traefik.http.routers.gt-staging-up101.middlewares: gt-staging-in8,gt-staging-buf101
      # 한글 올리기
      traefik.http.routers.gt-staging-up31.rule: Host(`t.goteacher.xyz`) && Method(`POST`) && PathRegexp(`^/s/[^/]+/hwp/upload$$`)
      traefik.http.routers.gt-staging-up31.priority: "1000"
      traefik.http.routers.gt-staging-up31.entrypoints: websecure
      traefik.http.routers.gt-staging-up31.tls: "true"
      traefik.http.routers.gt-staging-up31.tls.certresolver: letsencrypt
      traefik.http.routers.gt-staging-up31.service: gt-staging
      traefik.http.routers.gt-staging-up31.middlewares: gt-staging-in8b,gt-staging-buf31
      # 수리 사진·식판 사진·폰 사진
      traefik.http.routers.gt-staging-up9.rule: Host(`t.goteacher.xyz`) && Method(`POST`) && PathRegexp(`^/s/[^/]+/(repairs/new|repairs/[^/]+/edit|meals/[^/]+/upload)$$|^/m/[^/]+$$`)
      traefik.http.routers.gt-staging-up9.priority: "1000"
      traefik.http.routers.gt-staging-up9.entrypoints: websecure
      traefik.http.routers.gt-staging-up9.tls: "true"
      traefik.http.routers.gt-staging-up9.tls.certresolver: letsencrypt
      traefik.http.routers.gt-staging-up9.service: gt-staging
      traefik.http.routers.gt-staging-up9.middlewares: gt-staging-in16,gt-staging-buf9
      # 메모리에는 64KB까지만, 넘으면 Traefik 컨테이너 /tmp(공용 호스트 디스크)
      traefik.http.middlewares.gt-staging-buf3.buffering.maxRequestBodyBytes: "3145728"
      traefik.http.middlewares.gt-staging-buf3.buffering.memRequestBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf3.buffering.memResponseBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf101.buffering.maxRequestBodyBytes: "105906176"
      traefik.http.middlewares.gt-staging-buf101.buffering.memRequestBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf101.buffering.memResponseBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf31.buffering.maxRequestBodyBytes: "32505856"
      traefik.http.middlewares.gt-staging-buf31.buffering.memRequestBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf31.buffering.memResponseBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf9.buffering.maxRequestBodyBytes: "9437184"
      traefik.http.middlewares.gt-staging-buf9.buffering.memRequestBodyBytes: "65536"
      traefik.http.middlewares.gt-staging-buf9.buffering.memResponseBodyBytes: "65536"
      # 동시 건수(라우터별 서비스 전체). 넘으면 429. 8×101MB + 8×31MB + 16×9MB
      traefik.http.middlewares.gt-staging-in8.inflightreq.amount: "8"
      traefik.http.middlewares.gt-staging-in8.inflightreq.sourcecriterion.requesthost: "true"
      traefik.http.middlewares.gt-staging-in8b.inflightreq.amount: "8"
      traefik.http.middlewares.gt-staging-in8b.inflightreq.sourcecriterion.requesthost: "true"
      traefik.http.middlewares.gt-staging-in16.inflightreq.amount: "16"
      traefik.http.middlewares.gt-staging-in16.inflightreq.sourcecriterion.requesthost: "true"
      traefik.http.routers.gt-staging-http.rule: Host(`t.goteacher.xyz`)
      traefik.http.routers.gt-staging-http.entrypoints: web
      traefik.http.routers.gt-staging-http.middlewares: gt-staging-redirect
      traefik.http.routers.gt-staging-http.service: gt-staging
      # 공용 Traefik(--accesslog=true, stdout·회전 없음)에 링크·초대·공간 토큰이 경로째 남지 않게 고티처 라우터만 접근 로그를 끈다(G3).
      # Traefik v3.1+ 라우터 observability. 3.7.5 로컬 재현: 이 라우터 요청은 안 남고 다른 라우터는 남음. 공용 설정은 그대로.
      traefik.http.routers.gt-staging.observability.accesslogs: "false"
      traefik.http.routers.gt-staging-http.observability.accesslogs: "false"
      traefik.http.routers.gt-staging-body.observability.accesslogs: "false"
      traefik.http.routers.gt-staging-up101.observability.accesslogs: "false"
      traefik.http.routers.gt-staging-up31.observability.accesslogs: "false"
      traefik.http.routers.gt-staging-up9.observability.accesslogs: "false"
      traefik.http.middlewares.gt-staging-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.gt-staging-redirect.redirectscheme.permanent: "true"
      traefik.http.services.gt-staging.loadbalancer.server.port: "8000"
      # 무중단 교체(G6, rollout.sh): Traefik이 1초마다 /healthz를 보고 503(비우는 중)이면 그 컨테이너를 뺀다.
      # Host는 Docker healthcheck와 같은 localhost(ALLOWED_HOSTS). 컨테이너 IP로 보내면 Django가 400을 준다.
      # 제한 5초: Traefik은 한 번 실패로 뺀다 — worker가 느린 요청으로 잠깐 밀려도 하나뿐인 서버를 빼지 않게
      traefik.http.services.gt-staging.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.gt-staging.loadbalancer.healthcheck.hostname: localhost
      traefik.http.services.gt-staging.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.gt-staging.loadbalancer.healthcheck.timeout: 5s

  # 작업 큐(RQ). 앱과 같은 이미지(deploy.sh가 goteacher-app으로 빌드). 밖에 열지 않는다.
  # 작업당 상한 300초는 config/queue.py(settings.RQ_JOB_TIMEOUT).
  goteacher-worker:
    <<: *common
    image: goteacher-app:latest
    pull_policy: never
    env_file: .env
    working_dir: /srv/app
    # 두 큐를 한 프로세스가 default 먼저 듣는다(한글 변환 hwp 큐가 길어도 default 작업이 앞에 선다).
    command: ["python", "-m", "config.worker", "default", "hwp"]
    volumes: [media:/srv/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    # 한글 변환 1건 약 2GB 추정(30번) + worker 본체. 동시 1건(프로세스 1개)
    mem_limit: 2560m
    memswap_limit: 2560m  # 스왑 금지(공용 서버 보호). 넘으면 작업만 죽고 실패 처리
    # 배포 때 진행 중 작업을 30초까지 기다리고, 넘으면 끊는다(작업은 실패 목록으로)
    stop_grace_period: 30s
    labels:
      traefik.enable: "false"

  db:
    <<: *common
    # 다이제스트 고정(2026-11-03 서버에서 돌던 것과 같은 값). deploy.sh는 db·redis를 다시 만들지 않는다(--no-deps) — 갱신은 ops/README.md
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: goteacher
      POSTGRES_USER: goteacher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goteacher -d goteacher"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports 없음: 밖에 열지 않는다(goteacher_default 네트워크 안에서만).

  redis:
    <<: *common
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    # 큐(RQ, db 0)와 캐시(빈도 제한, db 1)를 함께 둔다. noeviction: RQ의 worker 등록 키(만료 있음)가 지워지지 않게.
    # 빈도 제한 키는 1분~1시간 만료라 IP 수만큼만 쌓여 96mb에 한참 못 미치고, 캐시 쓰기가 실패하면 막지 않는다(ratelimit.py).
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    mem_limit: 128m
    # ports 없음

volumes:
  pgdata:
  redisdata:
  media:  # goteacher_media. 보관 기간 자동 삭제는 E3

networks:
  infra:
    external: true
