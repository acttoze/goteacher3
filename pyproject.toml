[project]
name = "goteacher"
version = "0.1.0"
description = "고티처 — 학교 업무 협업 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    # hwp/ 한글 엔진. 6.10 고정(벤치 근거). pyhwp(AGPL)는 쓰지 않는다.
    "python-hwpx==6.10.*",
    "lxml>=4.9,<7",
    "whitenoise>=6.8",
]

[tool.uv]
package = false

# 린트는 오류급만(B2). 스타일 규칙은 넓히지 않는다. 버전은 CI에서 고정.
[tool.ruff]
include = ["app/**/*.py", "hwp/**/*.py", "ops/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
