{# 설정 > 내 정보 > 비밀번호 바꾸기(P1, 아이디 회원만). htmx로 이 영역만 다시 받는다. 입력 값은 다시 채우지 않는다. #}
<section class="srow" id="pwArea" data-err-swap><div class="lab"><h2>비밀번호</h2><p>아이디 <b>{{ request.user.username }}</b>로 로그인해요. 바꾸면 이 PC는 그대로, 다른 PC의 로그인은 끊겨요.</p></div>
  <form class="panel pad" method="post" action="/s/{{ space.token }}/settings/password" hx-post="/s/{{ space.token }}/settings/password" hx-target="#pwArea" hx-swap="outerHTML">
    {% csrf_token %}
    {% if pw_done %}<span class="sr" data-toast-now="비밀번호를 바꿨어요"></span>{% endif %}
    <label class="field"><span>지금 비밀번호</span><input class="input" type="password" name="current" autocomplete="current-password" required style="max-width:280px"{% if pw_errors.current %} aria-invalid="true"{% endif %}>
      {% if pw_errors.current %}<span class="field-err" role="alert">{{ pw_errors.current }}</span>{% endif %}</label>
    <label class="field"><span>새 비밀번호 <span class="hint">8자 이상</span></span><input class="input" type="password" name="password" autocomplete="new-password" required style="max-width:280px"{% if pw_errors.password %} aria-invalid="true"{% endif %}>
      {% if pw_errors.password %}<span class="field-err" role="alert">{{ pw_errors.password }}</span>{% endif %}</label>
    <label class="field"><span>새 비밀번호 확인</span><input class="input" type="password" name="password2" autocomplete="new-password" required style="max-width:280px"{% if pw_errors.password2 %} aria-invalid="true"{% endif %}>
      {% if pw_errors.password2 %}<span class="field-err" role="alert">{{ pw_errors.password2 }}</span>{% endif %}</label>
    <div><button class="btn sec" type="submit">비밀번호 바꾸기</button></div>
  </form></section>
