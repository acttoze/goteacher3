{% extends "bare.html" %}
{% block title %}비밀번호 바꾸기 · 고티처{% endblock %}
{% block head %}
<style>
  /* P1 임시 비밀번호로 들어온 뒤: 바꾸기 전에는 이 화면만(accounts.middleware). */
  .bare.wide { max-width: 560px; padding-top: 40px; }
  .fp-h { font-size: 32px; line-height: 1.18; letter-spacing: -0.04em; font-weight: 800; }
  .fp-lead { margin-top: 12px; font-size: 18px; color: var(--muted); }
  .fp { margin-top: 28px; padding: 28px; gap: 22px; }
</style>
{% endblock %}
{% block main %}
<h1 class="fp-h">새 비밀번호를 정해 주세요</h1>
<p class="fp-lead">임시 비밀번호로 들어왔어요. 새 비밀번호로 바꾸면 하던 화면으로 이어져요.</p>
<form class="card fp" method="post" action="/account/password" novalidate>
  {% csrf_token %}
  {% if next and next != '/' %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <label class="field"><span>새 비밀번호 <span class="hint">8자 이상</span></span>
    <input class="input lg" type="password" name="password" autocomplete="new-password" required autofocus{% if errors.password %} aria-invalid="true" aria-describedby="e-password"{% endif %}>
    {% if errors.password %}<span class="field-err" id="e-password" role="alert">{{ errors.password }}</span>{% endif %}</label>
  <label class="field"><span>새 비밀번호 확인</span>
    <input class="input lg" type="password" name="password2" autocomplete="new-password" required{% if errors.password2 %} aria-invalid="true" aria-describedby="e-password2"{% endif %}>
    {% if errors.password2 %}<span class="field-err" id="e-password2" role="alert">{{ errors.password2 }}</span>{% endif %}</label>
  <div><button class="btn pri lg" type="submit">바꾸고 계속하기</button></div>
</form>
{% endblock %}
