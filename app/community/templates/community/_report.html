{# 신고 칸. 같은 사람은 한 번만 낸다. #}
<details><summary class="btn ghost sm">신고</summary>
  <form method="post" action="{{ action }}">{% csrf_token %}
    <label><span class="sr">까닭</span><select class="select" name="reason"><option value="">까닭 고르기(선택)</option>{% for v, label in reasons %}<option value="{{ v }}">{{ label }}</option>{% endfor %}</select></label>
    <button class="btn sec sm" type="submit">운영자에게 신고</button>
  </form>
</details>
