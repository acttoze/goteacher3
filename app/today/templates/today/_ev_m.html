{# U1 카드 아래 줄: ●(소속 색) 소속 · 이름 · 그 밖(시간 등), 내 글이면 오른쪽 '내 글'. 넘겨받는 값: x(gc·who·mine), rest(글자), conf(장소 겹침). #}<span class="m">{% if x.gc %}<i class="dot" style="--gc:{{ x.gc }}" aria-hidden="true"></i>{% endif %}{% if x.who %}<span>{{ x.who }}</span>{% endif %}{% if rest %}<span class="rest">{% if x.who %}· {% endif %}{{ rest }}</span>{% endif %}{% if conf %}<b class="cf">장소 겹침</b>{% endif %}{% if x.mine %}<span class="mine-tag">내 글</span>{% endif %}</span>
