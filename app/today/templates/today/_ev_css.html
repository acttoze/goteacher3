{# U1 일정 카드·머리줄(drafts/schedule-cards 확정안 F: B 카드 + C 머리줄). 일정 화면과 오늘 화면이 자기 <style> 맨 앞에 넣는다. #}
  :root { --u1-card-line: #e3e6eb; --u1-head: #eef1f5; --u1-head-line: #dde1e8; --u1-head-today: #dfe7ff; } /* taste-skill-ignore: 2026-11-10 사용자 확정 값(U1) */
  .ev { display: block; width: 100%; text-align: left; border: 0; font: inherit; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.35; padding: 8px 10px; border-radius: 8px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--u1-card-line); margin-bottom: 6px; position: relative; }
  button.ev, a.ev { cursor: pointer; }
  button.ev:hover, a.ev:hover { background: var(--surface); }
  .ev:last-child { margin-bottom: 0; }
  .ev .t { display: block; font-weight: 600; }
  .ev .k { font-weight: 700; color: var(--muted); margin-right: 2px; }
  .ev .m { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 3px; font-size: var(--fs-small); color: var(--faint); }
  .ev .m > span { white-space: nowrap; }
  .ev .m > .rest { white-space: normal; min-width: 0; }
  .ev .p { display: block; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
  .ev .dot, .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--gc); }
  .ev .t .dot { margin: 0 6px 2px 0; vertical-align: middle; }
  .ev.mine { box-shadow: inset 0 0 0 1.5px var(--accent); } /* 내가 쓴 글만 파란 테두리 */
  .ev .mine-tag { margin-left: auto; font-weight: 700; color: var(--accent-ink); }
  .ev.neis { background: transparent; box-shadow: none; border-radius: 0; padding: 4px 2px 6px; border-bottom: 1px solid var(--rule); }
  .ev.neis + .ev:not(.neis) { margin-top: 8px; }
  .auto { display: inline-flex; align-items: center; gap: 3px; font: 700 13px/1 var(--font); color: var(--muted); background: var(--surface); padding: 3px 6px; border-radius: 5px; white-space: nowrap; vertical-align: 1px; } /* 이름표 크기(.ptag와 같은 예외) */
  .ev .chg { display: block; color: var(--accent-ink); font-weight: 700; font-size: var(--fs-small); margin-top: 2px; }
  .ev del { color: var(--muted); font-weight: 400; }
  .ev .cf { font-weight: 700; color: var(--pill-warn-ink); }
