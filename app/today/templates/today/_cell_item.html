{# 일정 판 칸 안 항목 하나. 월간은 좁아서 제목·블록만(자세한 것은 대화상자). #}{% if x.kind == "ev" %}<button type="button" class="ev{% if x.mine %} mine{% endif %}{% if x.fresh %} fresh arrive{% endif %}" data-open="#ev-{{ x.e.key }}" aria-haspopup="dialog">{% if mode == "month" and x.e.date|date:"Y-m-d" != c.date %}↳ {% endif %}{{ x.e.title }}{% for w, a, b in x.changes %}<span class="chg">{{ w }} {{ a }} → {{ b }}</span>{% endfor %}{% if mode == "month" %}{% if x.e.slot or x.conf %}<span class="p">{% if x.e.slot %}{{ x.slot_label }}{% endif %}{% if x.conf %}{% if x.e.slot %} · {% endif %}<b class="cf">장소 겹침</b>{% endif %}</span>{% endif %}{% elif x.meta or x.conf %}<span class="p">{{ x.meta }}{% if x.conf %}{% if x.meta %} · {% endif %}<b class="cf">장소 겹침</b>{% endif %}</span>{% endif %}{% if x.fresh %}<span class="by"><span class="ptag{% if my_ink %} ink-t{% endif %}" style="--who:{{ my_color }}">{{ me.name }} · 방금</span></span>{% endif %}</button>{% elif x.kind == "due" %}<a class="ev due" href="{{ x.href }}"><span class="k">마감</span> {{ x.c.title }} · {{ x.hm }}{% if mode != "month" %}<span class="p">{{ x.who }}</span>{% endif %}</a>{% elif x.kind == "duty" %}<div class="ev duty"><span class="k">복무</span> {{ x.title }}{% if x.time %}<span class="p">{{ x.time }}</span>{% endif %}</div>{% else %}<div class="ev neis">{{ x.name }}<span class="p">나이스</span></div>{% endif %}
