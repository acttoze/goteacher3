{# 🔔 목록(design/assets/shell.js 알림 묶음). 누르면 읽음 + 그 화면으로(POST). #}
<div class="ph"><b>알림</b><span>안 읽은 {{ unread_n }}건</span></div>
{% for n in items %}
<form method="post" action="/s/{{ space.token }}/bell/{{ n.key }}">{% csrf_token %}<button class="pi tlink" type="submit" style="width:100%;text-align:left;font-weight:400"><span class="pill{% if not n.read %} acc{% endif %}">마감</span><span{% if n.read %} class="muted"{% endif %}>{{ n.text }}<br><span class="small muted">{{ n.get_kind_display }} 리마인드 · {{ n.created_at|date:"n/j H:i" }}{% if n.read %} · 읽음{% endif %}</span></span></button></form>
{% empty %}
<p class="pi muted">아직 알림이 없어요.</p>
{% endfor %}
<div class="pf">마감 전날과 당일 08:20에 아직 안 낸 모으기를 여기로 알려 드려요.</div>
