{# Q2 순서·소속 바꾸기 단추(끌기 대신, 키보드로도). name: 화면 읽기 이름. move가 있으면 옮기기 단추(좁은 줄이라 아이콘 + 보이지 않는 글자). #}
<span class="arr-btns"><button class="btn ghost sm arr-b" type="button" data-arr-act="up" aria-label="{{ name }} 앞으로">↑</button><button class="btn ghost sm arr-b" type="button" data-arr-act="down" aria-label="{{ name }} 뒤로">↓</button>{% if move %}<button class="btn ghost sm arr-b" type="button" data-arr-act="move" data-name="{{ name }}" title="{{ move }} 옮기기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg><span class="sr">{{ name }} {{ move }} 옮기기</span></button>{% endif %}</span>
