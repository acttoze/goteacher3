{% extends "shell.html" %}
{% block title %}학교 · 고티처{% endblock %}
{% block ptitle %}학교{% endblock %}
{% block head %}{% if link %}{% include "spaces/_invite_style.html" %}{% endif %}
<style>
  /* prototype school(): 그룹마다 카드, 교직원 40명이 1536×750 첫 화면에 여러 그룹으로 읽히게 줄을 낮게 둔다. */
  .gcard .card-h { min-height: 0; padding-bottom: 8px; }
  .gcard .card-b { padding-bottom: 16px; }
  .gcard .card-h .r, .aux { font-size: 15px; color: var(--muted); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .who, .task { margin: 0 -8px; padding: 0 8px; border-radius: var(--radius-in); overflow-wrap: anywhere; }
  /* 40명이 한 화면에 더 들어가게 네 칸으로 흘린다. 읽는 순서는 세로. */
  .gcols { columns: 4; column-gap: var(--gap); }
  .gcols > .gcard { break-inside: avoid; margin-bottom: var(--gap); }
  .gnone { margin: 0 0 16px; }
  .who { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; min-height: 36px; padding-right: 48px; }
  .who .pos { color: var(--muted); }
  .who b, .task b { font-weight: 600; }
  .who .tlink { position: absolute; top: -2px; right: 8px; display: inline-flex; align-items: center; min-height: var(--control-h-sm); padding: 0; font-weight: 500; color: var(--muted); }
  .who .tlink:hover { color: var(--accent); }
  /* 담당이 길어도 업무 칸이 한 글자 폭으로 눌리지 않게 40%는 남긴다 */
  .task { display: grid; grid-template-columns: minmax(40%, 1fr) minmax(0, max-content); gap: 0 12px; padding-block: 6px; align-items: baseline; }
  .task .pill { height: auto; padding-block: 3px; line-height: 1.3; }
  .gcard .card-h h2 { min-width: 0; overflow-wrap: anywhere; }
  .gcard .card-h .r { flex: none; }
  .tabs-n { margin-left: auto; align-self: center; flex: none; white-space: nowrap; }
  .logs td { overflow-wrap: anywhere; }
  .task .w { text-align: right; }
  .who.mine, .task.mine { background: var(--accent-soft); }
  .tab-note { margin-top: 16px; }
  .first { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .first p { flex: 1; min-width: 0; }
  .steps-w { margin-bottom: 20px; padding: 16px var(--pad); }
  .steps { list-style: none; counter-reset: st; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .steps li { counter-increment: st; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
  .steps b::before { content: counter(st) ". "; }
  .steps span { color: var(--muted); font-size: 15px; }
  .steps .btn.sec { background: var(--bg); }
  .logs { margin-top: var(--gap); }
  /* prototype school() 오늘 복무 현황 */
  .att { margin-bottom: 20px; }
  .att .card-b { padding-bottom: 16px; }
  .att-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px 24px; }
  .att-row li { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; min-height: 36px; overflow-wrap: anywhere; min-width: 0; }
  .att-row b { font-weight: 600; }
</style>{% endblock %}
{% block main %}{% include "spaces/_school.html" %}{% endblock %}
