{# P1 임시 비밀번호(관리자 명부 창). 한 번만 보인다. 저장하지 않는다. #}
{% if error %}<p class="field-err" role="alert">{{ error }}</p>
{% else %}<div class="stack-y" style="gap:8px" role="status">
  <p>아이디 <b>{{ username }}</b> · 임시 비밀번호 <b class="num" style="font-size:20px;letter-spacing:.06em">{{ temp }}</b></p>
  <p class="small muted">이 창을 닫으면 다시 볼 수 없어요. {{ m.name }} 선생님께 직접 알려 주고, 로그인한 뒤 설정 &gt; 내 정보에서 비밀번호를 바꾸도록 안내해 주세요. 그 선생님의 다른 PC 로그인은 모두 끊겼어요.</p>
</div>{% endif %}
