<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 — 고티처</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="doc.css">
<style>
  /* 셸: 틴트 L 프레임(사이드바 + 48px 위 띠) + 흰 시트(오른쪽·아래 8px 들임, 반경 16, 1px 테두리, 그림자 없음) */
  :root { --chrome: #f7f7f5; --edge: #eaeaea; --panel: #f6f6f4; --row: #fbfbfa; --row-edge: #ebebe8; }
  body { background: var(--chrome); }
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); min-height: 100vh; }
  .side { grid-row: 1 / 3; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
  .ws:hover { background: #ececea; }
  .ws b { display: block; font-size: 16px; }
  .ws small { display: block; font-size: 14px; color: var(--muted); }
  .nav a, .nav button { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #37352f; text-decoration: none; font-size: 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; transition: background-color .12s ease; }
  .nav a:hover, .nav button:hover { background: #ececea; }
  .nav a[aria-current="page"] { background: #e8e8e5; color: var(--ink); font-weight: 600; }
  .nav .sub { padding-left: 38px; color: var(--muted); }
  .nav .cnt { margin-left: auto; font-size: 14px; color: var(--muted); }
  .nav svg { flex: none; color: #8a8a86; }
  .grp { margin: 18px 10px 4px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .ppl { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; font-size: 16px; }
  .ppl small { margin-left: auto; color: var(--muted); font-size: 14px; }
  .side .foot { margin-top: auto; padding: 10px; display: flex; align-items: center; gap: 10px; }
  .side .foot b { display: block; font-size: 16px; } .side .foot small { display: block; font-size: 14px; color: var(--muted); }

  .top { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 8px; }
  .search { margin: 0 auto; width: min(548px, 100%); height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; border-radius: 8px; background: #ececea; color: var(--muted); font-size: 16px; border: 0; cursor: text; }
  .search .kbd { margin-left: auto; }
  .top .next { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #37352f; white-space: nowrap; }
  .sheet { margin: 0 8px 8px 0; background: #fff; border-radius: 16px; border: 1px solid var(--edge); min-width: 0; }
  .crumbs { display: flex; align-items: center; gap: 8px; padding: 12px 24px; font-size: 15px; color: var(--muted); }
  .crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--ink); }
  .crumbs .r { margin-left: auto; display: flex; gap: 8px; }

  /* 가운데 칼럼: 12칸 × 77px + 11 × 16px = 1100px */
  .col { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 8px 0 72px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .s3 { grid-column: span 3; } .s6 { grid-column: span 6; } .s9 { grid-column: span 9; } .s12 { grid-column: 1 / -1; }
  .pgicon { grid-column: 1 / -1; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-tint); display: grid; place-items: center; color: var(--accent); }
  h1 { grid-column: 1 / -1; margin: 4px 0 0; font-size: 32px; line-height: 1.3; letter-spacing: -0.025em; font-weight: 700; }
  .sub { grid-column: 1 / -1; margin: -6px 0 0; color: var(--muted); font-size: 16px; }
  .find { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 14px 16px 14px 18px; border-radius: 12px; background: var(--accent-tint); margin-top: 10px; }
  .find .ic { color: var(--accent); flex: none; }
  .find p { margin: 0; flex: 1; font-size: 17px; }
  .find .acts { display: flex; gap: 8px; flex: none; }
  .find .btn.ghost { background: #fff; }

  .tile { height: 128px; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; background: var(--panel); }
  .tile .l { font-size: 15px; color: #4f4f4c; display: flex; align-items: center; gap: 8px; }
  .tile .l i { width: 10px; height: 10px; border-radius: 3px; }
  .tile .v { margin-top: auto; font-size: 30px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 16px; color: var(--muted); margin-left: 2px; }
  .tile .c { font-size: 14px; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-green { background: var(--t-green); } .k-rose { background: var(--t-rose); } .k-blue { background: var(--t-blue); } .k-stone { background: var(--t-stone); }
  .dot-green { background: var(--accent); } .dot-rose { background: #c0605a; } .dot-blue { background: #4f7fa8; } .dot-stone { background: #8f8d86; }

  .panel { border-radius: 12px; padding: 20px; background: var(--panel); min-width: 0; }
  .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 40px; }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .chip { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 6px; background: rgba(0,0,0,.06); font-size: 14px; font-weight: 600; }
  .ph .r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .ph .lnk { font-size: 15px; color: var(--muted); text-decoration: none; padding: 8px; border-radius: 6px; }
  .ph .lnk:hover { color: var(--ink); background: rgba(0,0,0,.04); }

  /* 오늘 일과: 화면에서 한 번만 쓰는 흰 안쪽 카드 */
  .inner { background: #fff; border-radius: 10px; padding: 6px 14px 10px; }
  .vtabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: rgba(0,0,0,.05); }
  .vtabs button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: none; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .vtabs button[aria-selected="true"] { background: #fff; color: var(--ink); }
  .day { width: 100%; border-collapse: collapse; font-size: 16px; }
  .day th { text-align: left; font-weight: 500; font-size: 14px; color: var(--muted); padding: 10px 10px 8px; }
  .day td { padding: 10px; vertical-align: top; box-shadow: inset 0 1px 0 var(--line); } /* taste-skill-ignore: 표 행 구분 */
  .day td.t { width: 132px; }
  .day td.t b { display: block; font-size: 16px; }
  .day td.t span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day td.t .nowtag { color: #fff; font-size: 14px; }
  .day tr.now td { background: var(--accent-tint); }
  .day tr.now td.t b { color: var(--accent); }
  .day .nowtag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ev { display: block; margin-bottom: 4px; }
  .ev b { font-weight: 600; }
  .ev .m { display: block; font-size: 14px; color: var(--muted); }
  .ev.mine b { color: var(--accent-press); }
  .chg { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #4f4f4c; }
  .chg del { color: #62625f; } .chg ins { text-decoration: none; font-weight: 700; color: var(--ink); background: #fbe9b8; padding: 0 4px; border-radius: 4px; }
  .none { color: var(--muted); }
  .dboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 8px 0 4px; }
  .dboard .c { background: var(--panel); border-radius: 8px; padding: 10px; min-height: 248px; }
  .dboard .c.now { background: var(--accent-tint); }
  .dboard .c h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; } .dboard .c h3 span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .dboard .card2 { background: #fff; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 15px; line-height: 1.4; border: 1px solid var(--row-edge); }
  .dboard .card2.me { box-shadow: inset 3px 0 0 var(--accent); } /* taste-skill-ignore: 내 수업 표시 */

  /* 행 카드: 패널보다 한 단계 밝게, 테두리 한 단계 진하게 */
  .rows { display: grid; gap: 8px; }
  .rc { min-height: 63px; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--row); border: 1px solid var(--row-edge); transition: background-color .15s ease, opacity .2s ease; }
  .rc:hover { background: #fff; }
  .rc .tx { flex: 1; min-width: 0; }
  .rc .tx b { display: block; font-weight: 600; line-height: 1.35; }
  .rc .tx small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .rc .due { flex: none; font-size: 14px; color: #4f4f4c; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .rc.done .tx b { text-decoration: line-through; color: #8f8f8b; }
  .rc.done { opacity: .7; }
  .empty { padding: 18px 14px; border-radius: 10px; background: var(--row); color: var(--muted); font-size: 16px; }
  .k-rose .rc, .k-blue .rc, .k-stone .rc { background: rgba(255,255,255,.62); }
  .k-rose .rc:hover, .k-stone .rc:hover { background: #fff; }

  .panel .db { background: transparent; }
  .panel .db .db-tabs { box-shadow: inset 0 -1px 0 rgba(0,0,0,.08); } /* taste-skill-ignore: 데이터베이스 탭 밑줄 */
  .panel .db td { box-shadow: inset 0 1px 0 rgba(0,0,0,.07); } /* taste-skill-ignore: 표 행 구분 */
  .panel .db .board .col { background: rgba(255,255,255,.55); }
  .panel .db .cal .d { background: rgba(255,255,255,.55); min-height: 112px; }

  .tgl { border-radius: 10px; background: rgba(255,255,255,.62); margin-bottom: 8px; }
  .tgl > summary { padding: 12px 12px 12px 8px; }
  .tgl > summary b { font-weight: 600; }
  .tgl > summary small { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .tgl .tgl-b { font-size: 16px; padding-bottom: 14px; }
  .meal { display: flex; flex-wrap: wrap; gap: 6px; }
  .meal span { padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.7); font-size: 16px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 14px 0 0; font-size: 16px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .bundle { display: grid; gap: 8px; }
  .bundle div { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.62); font-size: 16px; }
  .bundle b { font-variant-numeric: tabular-nums; }
  .bundle .next { background: #fff; box-shadow: inset 3px 0 0 var(--accent); } /* taste-skill-ignore: 다음 알림 표시 */
  .mates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .mates .av { width: 32px; height: 32px; font-size: 14px; }

  @media (max-width: 1180px) { .app { grid-template-columns: 210px minmax(0, 1fr); } }
  @media (max-width: 900px) {
    .app { display: block; }
    .side { display: none; }
    .top { height: 48px; padding: 0 12px; } .top .next { display: none; }
    .sheet { margin: 0; border-radius: 0; border: 0; }
    .col { grid-template-columns: 1fr; width: auto; padding: 24px 16px 48px; }
    .s3, .s6, .s9 { grid-column: 1 / -1; }
    .tiles .tile { grid-column: auto; height: 116px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; grid-column: 1 / -1; }
    h1 { font-size: 26px; }
    .find { flex-direction: column; align-items: flex-start; }
    .day td.t { width: 88px; }
    .dboard { grid-template-columns: 1fr 1fr; }
    .crumbs .r { display: none; }
  }
  @media (min-width: 901px) { .tiles { display: contents; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="공간">
    <button class="ws" type="button">
      <svg width="28" height="28" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#0f7b6c"/><rect x="6" y="6" width="10" height="2.4" rx="1.2" fill="#fff"/><rect x="6" y="10" width="7" height="2.4" rx="1.2" fill="#fff"/><rect x="6" y="14" width="10" height="2.4" rx="1.2" fill="#fff"/></svg>
      <span><b id="wsName">새솔초 4학년</b><small>고티처 · 동학년 공간</small></span>
    </button>
    <nav class="nav" aria-label="페이지">
      <a href="today.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 5.5V9l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>오늘</a>
      <a href="#collect"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="3" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 7h13M7 7v8" stroke="currentColor" stroke-width="1.6"/></svg>모으기<span class="cnt" id="navCnt"></span></a>
      <a href="#collect" class="sub">학예회 반별 참가 인원</a>
      <a href="#todo" class="sub">받은 것</a>
      <a href="#day"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="11.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 7.5h13M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.6"/></svg>일정</a>
      <a href="index.html#promise"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2.5h7l3 3V15.5H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>양식 자료실</a>
    </nav>
    <div class="grp">4학년 동학년</div>
    <div id="people"></div>
    <div class="foot"><span class="av p2" aria-hidden="true">정</span><span><b id="meName">정하은</b><small id="meRole">4학년 2반 담임</small></span></div>
  </aside>

  <header class="top">
    <button class="search" type="button" id="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6"/></svg>찾거나 / 로 블록 넣기<span class="kbd">⌘K</span></button>
    <span class="next" id="nextAlert"></span>
  </header>

  <main class="sheet">
    <div class="crumbs"><a href="#">새솔초 4학년</a><span aria-hidden="true">/</span><span>오늘</span><span class="r"><button class="btn sm" type="button" id="share">초대 링크 복사</button></span></div>
    <div class="col">
      <span class="pgicon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14 8.5V14l4 2.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></span>
      <h1 id="greet"></h1>
      <p class="sub" id="subline"></p>
      <div class="find" id="find">
        <svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v6M12 16v.5" stroke="currentColor" stroke-width="2"/></svg>
        <p id="findText"></p>
        <div class="acts"><button class="btn ghost" type="button" id="formBtn">원본 한글 양식</button><button class="btn pri" type="button" id="mainBtn"></button></div>
      </div>

      <div class="tiles" id="tiles"></div>

      <section class="panel k-green s9" id="day" aria-labelledby="h-day">
        <div class="ph"><h2 id="h-day">오늘 일과</h2><span class="chip" id="dayCnt"></span>
          <div class="r"><div class="vtabs" role="tablist" aria-label="보기"><button type="button" role="tab" data-dv="table" aria-selected="true">표</button><button type="button" role="tab" data-dv="board" aria-selected="false">보드</button></div><a class="lnk" href="#">이번 주</a></div>
        </div>
        <div class="inner" id="dayBody"></div>
      </section>

      <section class="panel k-rose s3" id="todo" aria-labelledby="h-todo">
        <div class="ph"><h2 id="h-todo">내가 낼 것</h2><span class="chip" id="todoCnt"></span><div class="r"><a class="lnk" href="#">모두</a></div></div>
        <div class="rows" id="todoList"></div>
      </section>

      <section class="panel k-blue s6" id="collect" aria-labelledby="h-sent">
        <div class="ph"><h2 id="h-sent">내가 보낸 모으기</h2><span class="chip" id="sentCnt"></span><div class="r"><a class="lnk" href="#">모두</a></div></div>
        <div class="db" id="sentDb"></div>
      </section>

      <section class="panel k-stone s6" aria-labelledby="h-chg">
        <div class="ph"><h2 id="h-chg">어제 이후 바뀐 것</h2><span class="chip" id="chgCnt"></span><div class="r"><span style="font-size:15px;color:var(--muted)">나 · 4학년 대상</span></div></div>
        <div id="chgList"></div>
      </section>

      <section class="panel s6" aria-labelledby="h-meal">
        <div class="ph"><h2 id="h-meal">급식 · 학사</h2><div class="r"><span style="font-size:15px;color:var(--muted)">NEIS에서 자동</span></div></div>
        <div class="meal" id="meal"></div>
        <dl class="kv" id="mealKv"></dl>
      </section>

      <section class="panel s6" aria-labelledby="h-bundle">
        <div class="ph"><h2 id="h-bundle">묶음 알림</h2><div class="r"><span style="font-size:15px;color:var(--muted)">수업 중엔 띄우지 않아요</span></div></div>
        <div class="bundle" id="bundle"></div>
        <div class="mates" id="mates"></div>
      </section>
    </div>
  </main>
</div>

<script src="../shared/today-data.js"></script>
<script src="doc.js"></script>
<script>
(function () {
  var G = window.GT, D = window.DocA, esc = D.esc, $ = function (s) { return document.querySelector(s); };
  var NOW = '11:05'; // 시안 시연 시각(2블록 중)
  var slotOf = function (k) { return G.slots.filter(function (s) { return s.k === k; })[0]; };
  var nowSlot = slotOf(G.nowSlot);
  var done = {}; // 체크한 낼 것

  function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  var urgent = G.todo.filter(function (t) { return t.urgent; })[0];
  var dueAt = (urgent.due.match(/\d{1,2}:\d{2}/) || ['14:00'])[0];
  var leftM = mins(dueAt) - mins(NOW), leftTxt = Math.floor(leftM / 60) + '시간 ' + (leftM % 60) + '분';
  var sent = G.sent[0], rs = D.rows(), sm = D.sums(rs);

  // 머리: 인사말 = 사람 + 오늘의 사실 하나
  $('#greet').textContent = G.me.name + ' 선생님, ' + urgent.title.replace(/\s*\(.*\)/, '') + '가 오늘 ' + dueAt + '에 마감돼요.';
  $('#subline').innerHTML = G.date.label + ' · ' + G.date.week + ' · 지금 <b>' + nowSlot.label + '</b> ' + esc(G.events.filter(function (e) { return e.s === G.nowSlot && e.mine; })[0].title) + ' (' + nowSlot.from + '–' + nowSlot.to + ')';
  var nextBlock = G.slots[G.slots.indexOf(nowSlot) + 1];
  $('#findText').innerHTML = '<b>' + leftTxt + '</b> 남았어요. ' + nextBlock.label + '이 시작되는 <b class="num">' + nextBlock.from + '</b> 전에 내면 다음 묶음 알림에서 빠져요.';
  $('#mainBtn').textContent = '수요조사 내기';
  $('#mainBtn').onclick = function () { toggleTodo(urgent.id, true); D.toast('냈어요: ' + urgent.title + ' (시안)'); };
  $('#formBtn').onclick = function () { D.toast('원본 한글 양식을 내려받아요 (시안)'); };
  $('#nextAlert').innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5a4 4 0 0 1 8 0c0 4.5 2 5.5 2 5.5H2s2-1 2-5.5M6.8 14a1.4 1.4 0 0 0 2.4 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>다음 알림 <b class="num">' + G.nextBundle.at + '</b>';

  // 숫자 타일 4: 각 타일의 색 = 아래 패널의 색
  function tiles() {
    var open = G.todo.filter(function (t) { return !done[t.id]; });
    var today = open.filter(function (t) { return /오늘/.test(t.due); }).length;
    $('#tiles').innerHTML = [
      ['k-green', 'dot-green', '지금', nowSlot.label, '', nowSlot.from + '–' + nowSlot.to + ' · 4-2 수업공개'],
      ['k-rose', 'dot-rose', '내가 낼 것', open.length, '건', open.length ? '오늘 마감 ' + today + '건' : '모두 냈어요'],
      ['k-blue', 'dot-blue', '보낸 모으기', sm.done, '/' + sm.total + '반', sm.left.map(function (r) { return r.cls; }).join(' · ') + ' 기다림'],
      ['k-stone', 'dot-stone', '어제 이후 바뀐 것', G.changes.length, '건', '나 · 4학년 대상']
    ].map(function (t) { return '<div class="tile ' + t[0] + ' s3"><span class="l"><i class="' + t[1] + '" aria-hidden="true"></i>' + t[2] + '</span><span class="v">' + t[3] + '<small>' + t[4] + '</small></span><span class="c">' + esc(t[5]) + '</span></div>'; }).join('');
    $('#navCnt').textContent = open.length;
    $('#todoCnt').textContent = open.length;
  }

  // 오늘 일과 데이터베이스: 표(블록 행) ↔ 보드(블록 열)
  var rowsDef = [{ k: null, label: '전일', time: '시간 미정' }].concat(G.slots.map(function (s) { return { k: s.k, label: s.label, time: s.from + (s.to ? '–' + s.to : '~') }; }));
  function evHtml(e) {
    var chg = e.changed ? '<span class="chg"><span aria-hidden="true">' + esc(e.changed.what) + '</span> <del>' + esc(e.changed.from) + '</del> → <ins>' + esc(e.changed.to) + '</ins></span>' : '';
    return '<span class="ev' + (e.mine ? ' mine' : '') + '"><b>' + esc(e.title) + '</b><span class="m">' + esc([e.place, e.who].filter(Boolean).join(' · ')) + '</span>' + chg + '</span>';
  }
  function dayTable() {
    return '<table class="day"><thead><tr><th>블록</th><th>내 수업</th><th>4학년 · 학교</th></tr></thead><tbody>' + rowsDef.map(function (r) {
      var tt = r.k ? G.timetable.filter(function (t) { return t.k === r.k; })[0] : null;
      var evs = G.events.filter(function (e) { return (e.s || null) === r.k && !(tt && e.mine && r.k === G.nowSlot && false); });
      var isNow = r.k === G.nowSlot;
      return '<tr class="' + (isNow ? 'now' : '') + '"><td class="t"><b>' + r.label + '</b><span>' + r.time + '</span>' + (isNow ? '<br><span class="nowtag">지금 ' + NOW + '</span>' : '') + '</td>' +
        '<td>' + (tt ? '<span class="ev"><b>' + esc(tt.sub) + '</b><span class="m">' + esc(tt.room + (tt.note ? ' · ' + tt.note : '')) + '</span></span>' : '<span class="none">' + (r.k ? '수업 없음' : '—') + '</span>') + '</td>' +
        '<td>' + (evs.length ? evs.map(evHtml).join('') : '<span class="none">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function dayBoard() {
    return '<div class="dboard">' + rowsDef.map(function (r) {
      var tt = r.k ? G.timetable.filter(function (t) { return t.k === r.k; })[0] : null;
      var evs = G.events.filter(function (e) { return (e.s || null) === r.k; });
      return '<div class="c' + (r.k === G.nowSlot ? ' now' : '') + '"><h3>' + r.label + '<span>' + (r.k ? slotOf(r.k).from : '') + '</span></h3>' +
        (tt ? '<div class="card2 me">' + esc(tt.sub) + '</div>' : '') +
        evs.map(function (e) { return '<div class="card2">' + esc(e.title) + (e.changed ? '<br><span class="chg"><del>' + esc(e.changed.from) + '</del> → <ins>' + esc(e.changed.to) + '</ins></span>' : '') + '</div>'; }).join('') + '</div>';
    }).join('') + '</div>';
  }
  function setDay(v) {
    $('#dayBody').innerHTML = v === 'board' ? dayBoard() : dayTable();
    document.querySelectorAll('[data-dv]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.dv === v); });
  }
  document.querySelectorAll('[data-dv]').forEach(function (b) { b.onclick = function () { setDay(b.dataset.dv); }; });
  $('#dayCnt').textContent = G.events.length;
  setDay('table');

  // 내가 낼 것: 체크하면 지워지고 타일·사이드바 수가 같이 바뀐다
  function todo() {
    var open = G.todo.filter(function (t) { return !done[t.id]; });
    $('#todoList').innerHTML = (open.length ? '' : '<div class="empty">오늘 낼 것이 없어요.</div>') + G.todo.map(function (t) {
      var d = !!done[t.id];
      return '<label class="rc' + (d ? ' done' : '') + '"><input type="checkbox" class="chk" data-id="' + t.id + '"' + (d ? ' checked' : '') + ' aria-label="' + esc(t.title) + ' 냈음으로 표시"><span class="tx"><b>' + esc(t.title) + '</b><small>' + esc(t.from) + '</small>' +
        (t.urgent ? '<span class="pill due" style="margin-top:6px">' + esc(t.due) + ' 마감</span>' : '<small class="num">' + esc(t.due) + ' · ' + esc(t.kind) + '</small>') + '</span></label>';
    }).join('');
    document.querySelectorAll('#todoList .chk').forEach(function (c) { c.onchange = function () { toggleTodo(c.dataset.id, c.checked); }; });
  }
  function toggleTodo(id, on) { if (on) done[id] = true; else delete done[id]; todo(); tiles(); }

  // 내가 보낸 모으기
  $('#sentCnt').textContent = G.sent.length;
  D.db($('#sentDb'), 'table');

  // 바뀐 것: 토글
  $('#chgCnt').textContent = G.changes.length;
  $('#chgList').innerHTML = G.changes.map(function (c, i) {
    return '<details class="tgl"' + (i === 0 ? ' open' : '') + '><summary><span class="tri" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span><b>' + esc(c.title) + '</b> · ' + esc(c.what) + '</span><small>' + esc(c.by) + '</small></summary>' +
      '<div class="tgl-b"><span class="chg"><del>' + esc(c.from) + '</del> → <ins>' + esc(c.to) + '</ins></span><br><span style="color:var(--muted);font-size:15px">' + esc(c.by) + ' 선생님이 바꿨어요. 오늘 일과에도 반영됐어요.</span></div></details>';
  }).join('');

  // 급식·학사
  $('#meal').innerHTML = G.meal.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('');
  $('#mealKv').innerHTML = '<dt>열량</dt><dd>' + G.mealKcal + ' kcal</dd><dt>학사</dt><dd>' + esc(G.neis) + '</dd>';

  // 묶음 알림 + 동학년
  var bundles = [['08:20', '어제 이후 바뀐 것 ' + G.changes.length + '건', '지남'], [G.nextBundle.at, G.nextBundle.label + ' · ' + urgent.title.replace(/\s*\(.*\)/, '') + ' ' + dueAt + ' 마감', '다음'], ['방과후', sent.title + ' ' + sm.left.map(function (r) { return r.cls; }).join(' · ') + ' 기다림', '예정']];
  $('#bundle').innerHTML = bundles.map(function (b) { return '<div class="' + (b[2] === '다음' ? 'next' : '') + '"><b>' + b[0] + '</b><span>' + esc(b[1]) + '</span><span class="pill ' + (b[2] === '다음' ? 'done' : 'tag') + '">' + b[2] + '</span></div>'; }).join('');
  var mates = rs.map(function (r) { return '<span class="av ' + r.pc + '" title="' + r.cls + ' ' + esc(r.name) + '">' + esc(r.name[0]) + '</span>'; }).join('');
  $('#mates').innerHTML = mates + '<span style="font-size:15px;color:var(--muted)">동학년 ' + rs.length + '명이 이 공간을 같이 써요</span>';
  $('#people').innerHTML = rs.map(function (r) { return '<div class="ppl"><span class="av ' + r.pc + '" aria-hidden="true">' + esc(r.name[0]) + '</span>' + esc(r.name) + '<small>' + r.cls + '</small></div>'; }).join('');

  $('#share').onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText('https://goteacher.xyz/j/예시').catch(function () {}); D.toast('초대 링크를 복사했어요 (시안)'); };
  $('#search').onclick = function () { D.toast('찾기 · 블록 넣기 창이 열려요 (시안)'); };
  document.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#search').click(); } });

  todo(); tiles();
  console.assert(G.todo.length === 4 && sm.done === 3, '오늘 화면 집계 불일치');
})();
</script>
</body>
</html>
