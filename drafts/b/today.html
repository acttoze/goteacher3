<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 — 고티처</title>
<link rel="stylesheet" href="cal.css">
<style>
  /* pastel-consumer 토큰을 브랜드 색에 맞춤: 카드 20 · 컨트롤 10 · 간격 24 · 제목 28 / 섹션 20 / 수치 32 / 본문 16 / 작은 글 14 */
  :root {
    --ground: #f4f5f7; --surface: #ffffff; --raised: #f7f8fa; --border: #e6e6e6; --rule: #f0f1f3; --control: #d6d9dd;
    --text: #16181d; --accent: var(--coral); --accent-ink: #16181d;
    --radius-card: 20px; --radius-control: 10px; --gap: 24px; --pad: 24px; --control-height: 40px;
    --fs-title: 28px; --fs-section: 20px; --fs-kpi: 32px; --fs-body: 16px; --fs-small: 14px;
    --sidebar: 240px;
    /* 동학년 다섯 명 — 사람마다 고정 색(옆 사람과 60도 이상 떨어지게) */
    --p1-bg: #d3f1f7; --p1-ink: #0b4a57;  /* 송민재 */
    --p2-bg: #ffe0e6; --p2-ink: #8a1530;  /* 정하은 */
    --p3-bg: #d5f4e2; --p3-ink: #0d4d2c;  /* 김도윤 */
    --p4-bg: #fff1b8; --p4-ink: #5c4300;  /* 이수빈 */
    --p5-bg: #dce6ff; --p5-ink: #1b3f8f;  /* 박서준 */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  button { font-family: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 셸: 바탕 위의 사이드바 ---------- */
  .side { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); padding: 28px 12px 20px; display: flex; flex-direction: column; gap: 4px; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--surface); text-align: left; cursor: pointer; margin-bottom: 20px; transition: background-color .15s; }
  .ws:hover { background: #fafafa; }
  .ws b { display: block; font-size: 16px; font-weight: 800; }
  .ws .wt span { display: block; font-size: 14px; color: var(--muted); }
  .side a.nav { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 16px; transition: background-color .15s; }
  .side a.nav:hover { background: #ebedf0; }
  .side a.nav[aria-current="page"] { background: #e7e9ec; font-weight: 700; }
  .side a.nav svg { flex: none; }
  .side a.nav .cnt { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--k-todo-ink); background: var(--k-todo-bg); border-radius: 8px; padding: 0 8px; line-height: 24px; }
  .side .grp { font-size: 14px; color: var(--muted); padding: 32px 12px 8px; }
  .people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .people li { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; font-size: 15px; }
  .people li span.c { color: var(--muted); font-size: 14px; margin-left: auto; }
  .av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; font-weight: 800; flex: none; }
  .invite { margin: 8px 12px 0; height: 40px; border-radius: 10px; border: 0; background: #e7e9ec; font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; transition: background-color .15s, transform .1s; }
  .invite:hover { background: #dfe2e6; }
  .invite:active { transform: scale(.97); }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 12px; }
  .side .bell { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .me { display: flex; align-items: center; gap: 10px; }
  .me b { display: block; font-size: 15px; }
  .me span { display: block; font-size: 14px; color: var(--muted); }

  /* ---------- 캔버스: 12칸, 간격 24 ---------- */
  /* 1440: 캔버스 1200 − 여백 80 = 1120 → (1120 − 11×24) / 12 = 71.3px. 8+4 / 4+5+3 칸이 양 끝에 닿는다 */
  main { margin-left: var(--sidebar); padding: 32px 40px 48px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: stretch; }
  .titlerow { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .titlerow h1 { font-size: var(--fs-title); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  .titlerow .date { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .finding { margin-top: 12px; font-size: 18px; font-weight: 600; }
  .finding b { color: var(--k-todo-ink); background: var(--k-todo-bg); border-radius: 6px; padding: 0 6px; }
  .actions { display: flex; gap: 12px; align-items: center; flex: none; }
  .quick { position: relative; }
  .quick input { width: 360px; height: 44px; border: 0; border-radius: 10px; background: var(--surface); padding: 0 44px 0 14px; font: inherit; font-size: 16px; color: var(--text); }
  .quick input::placeholder { color: #6b7079; }
  .quick kbd { position: absolute; right: 10px; top: 10px; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); background: var(--tone); border-radius: 6px; padding: 0 7px; line-height: 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--coral); color: var(--coral-ink); font-size: 16px; font-weight: 800; cursor: pointer; transition: background-color .15s, transform .1s; white-space: nowrap; }
  .btn:hover { background: #ff3a5c; }
  .btn:active { transform: scale(.97); }
  .btn.grey { background: #e7e9ec; color: var(--text); font-weight: 700; }
  .btn.grey:hover { background: #dfe2e6; }

  .card { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); min-width: 0; display: flex; flex-direction: column; }
  .card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .card-h h2 { font-size: var(--fs-section); font-weight: 700; letter-spacing: -0.01em; }
  .card-h .meta { font-size: 14px; color: var(--muted); }
  .c-cal { grid-column: span 8; }
  .c-todo { grid-column: span 4; }
  .c-sent { grid-column: span 4; }
  .c-chg { grid-column: span 5; }
  .c-meal { grid-column: span 3; }

  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .c-cal .cal { --rowh: 76px; }
  .c-cal .cal-row.all { min-height: 64px; }

  .kpi { font-size: var(--fs-kpi); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .c-todo .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
  .c-todo .todo-list { flex: 1; }

  .bar { height: 10px; border-radius: 5px; background: var(--tone); overflow: hidden; margin: 14px 0 12px; }
  .bar i { display: block; height: 100%; background: var(--coral); border-radius: 5px; }
  .crew { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .crew li { display: flex; align-items: center; gap: 10px; height: 32px; font-size: 15px; }
  .crew li .c { width: 32px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .crew li .st { margin-left: auto; font-size: 14px; font-weight: 700; border-radius: 8px; padding: 0 8px; line-height: 24px; }
  .crew li .st.ok { background: var(--k-school-bg); color: var(--k-school-ink); }
  .crew li .st.no { background: var(--k-todo-bg); color: var(--k-todo-ink); }
  .c-sent .row { display: flex; gap: 8px; margin-top: auto; padding-top: 16px; }
  .c-sent .row .btn { flex: 1; }
  .c-sent .t { font-size: 16px; font-weight: 700; }

  .chg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .chg li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-radius: 10px; background: var(--raised); }
  .chg .av { grid-row: span 2; }
  .chg b { font-size: 16px; font-weight: 700; }
  .chg .v { font-size: 15px; }
  .chg .v s { color: var(--muted); }
  .chg .v mark { background: var(--k-chg-bg); color: var(--k-chg-ink); border-radius: 4px; padding: 0 4px; font-weight: 700; }
  .chg .by { grid-column: 2; font-size: 14px; color: var(--muted); }

  .menu { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .menu li { font-size: 15px; background: var(--k-school-bg); color: var(--k-school-ink); border-radius: 8px; padding: 3px 10px; font-weight: 600; }
  .kv { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; font-size: 15px; }
  .kv div { display: flex; justify-content: space-between; gap: 8px; }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 700; text-align: right; }
  .bundles { list-style: none; margin: 16px 0 0; padding: 0; display: flex; gap: 6px; }
  .bundles li { flex: 1; text-align: center; border-radius: 10px; padding: 8px 4px; background: var(--raised); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bundles li b { display: block; font-size: 16px; color: var(--text); }
  .bundles li.next { background: var(--k-todo-bg); color: var(--k-todo-ink); }
  .bundles li.next b { color: var(--k-todo-ink); }
  .c-meal .kcal { font-size: 14px; color: var(--muted); margin-top: 10px; }

  .mtop { display: none; }
  @media (max-width: 1100px) {
    .titlerow { flex-wrap: wrap; align-items: flex-start; }
    .actions { flex-wrap: wrap; }
    .quick input { width: 300px; }
    .c-cal, .c-todo { grid-column: 1 / -1; }
    .c-sent, .c-chg, .c-meal { grid-column: span 12; }
  }
  @media (max-width: 1100px) {
    .side { display: none; }
    body.menu-open .side { display: flex; position: fixed; inset: 48px 0 0 0; width: auto; z-index: 30; background: var(--ground); overflow: auto; }
    .mtop { display: flex; position: sticky; top: 0; z-index: 40; height: 48px; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--ground); font-weight: 800; }
    .mtop button { height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: #e7e9ec; font-size: 15px; font-weight: 700; cursor: pointer; }
    main { margin-left: 0; padding: 16px 24px 40px; }
  }
  @media (max-width: 760px) {
    main { margin-left: 0; padding: 16px; grid-template-columns: 1fr; gap: 16px; }
    main > * { grid-column: 1 / -1 !important; }
    .titlerow { flex-direction: column; align-items: stretch; }
    .actions { flex-direction: column; align-items: stretch; }
    .quick input { width: 100%; }
    .c-cal .cal { --label: 64px; --lanes: 1 !important; }
    .c-cal .cal-head span:not(:first-child):not(:nth-child(2)) { display: none; }
    .c-cal .cal-head, .c-cal .cal-row { grid-template-columns: var(--label) minmax(0, 1fr); }
    .c-cal .cal-row .cal-cell { grid-column: 2; }
    .card-h { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="mtop"><span>오늘</span><button type="button" id="menuBtn" aria-expanded="false">메뉴</button></div>

<aside class="side" aria-label="고티처 메뉴">
  <button class="ws" type="button" aria-label="공간 바꾸기"><span class="gt-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="wt"><b>새솔초 4학년</b><span>동학년 공간 · 5명</span></span></button>
  <a class="nav" href="#" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>오늘</a>
  <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4z"/></svg>모으기<span class="cnt num" id="navCnt">4</span></a>
  <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>동학년 일정</a>
  <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>양식 자료실</a>
  <div class="grp">4학년 동학년</div>
  <ul class="people" id="people"></ul>
  <button class="invite" type="button" id="invite">초대 링크 복사</button>
  <div class="foot">
    <div class="bell"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bell"></span></div>
    <div class="me"><span class="av" style="background:var(--p2-bg);color:var(--p2-ink)">정</span><span><b>정하은</b><span>4학년 2반 담임</span></span></div>
  </div>
</aside>

<main>
  <div class="titlerow">
    <div>
      <h1>오늘</h1>
      <p class="date" id="date"></p>
      <p class="finding" id="finding"></p>
    </div>
    <div class="actions">
      <label class="quick"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">한 줄로 일정 추가</span><input id="quick" placeholder="한 줄로 추가 — 예: 학예회 소품 사기" autocomplete="off"><kbd>N</kbd></label>
      <button class="btn" type="button" id="mainAct">수요조사 내기</button>
    </div>
  </div>

  <section class="card c-cal" aria-labelledby="calH">
    <div class="card-h"><h2 id="calH">오늘 일과</h2>
      <div class="legend"><span><i style="background:var(--k-class-bg)"></i>내 수업 · 내 일정</span><span><i style="background:var(--k-school-bg)"></i>4학년 · 학교</span><span><i style="background:var(--k-todo-bg)"></i>할 일</span><span><i style="background:var(--k-chg-bg)"></i>바뀐 값</span></div>
    </div>
    <div class="cal" id="dayCal"></div>
  </section>

  <section class="card c-todo" aria-labelledby="todoH">
    <div class="card-h"><h2 id="todoH">나에게 온 것</h2><span class="meta">끌어서 블록에 놓기</span></div>
    <div class="head"><div><div class="kpi" id="todoKpi">4<small>건 남음</small></div><div class="sub" id="todoSub"></div></div></div>
    <div class="todo-list" id="todoList"></div>
  </section>

  <section class="card c-sent" aria-labelledby="sentH">
    <div class="card-h"><h2 id="sentH">내가 보낸 모으기</h2><span class="meta" id="sentDue"></span></div>
    <p class="t" id="sentTitle"></p>
    <div class="kpi" id="sentKpi" style="margin-top:8px"></div>
    <div class="bar" role="progressbar" aria-label="제출한 반" id="sentBar"><i></i></div>
    <ul class="crew" id="crew"></ul>
    <div class="row"><button class="btn grey" type="button" id="nudge">독촉 문구 복사</button></div>
  </section>

  <section class="card c-chg" aria-labelledby="chgH">
    <div class="card-h"><h2 id="chgH">어제 이후 바뀐 것</h2><span class="meta">나 · 4학년 대상만</span></div>
    <ul class="chg" id="chg"></ul>
  </section>

  <section class="card c-meal" aria-labelledby="mealH">
    <div class="card-h"><h2 id="mealH">급식 · 학사 · 알림</h2><span class="meta">NEIS 자동</span></div>
    <ul class="menu" id="menu"></ul>
    <p class="kcal num" id="kcal"></p>
    <div class="kv" id="kv"></div>
    <ul class="bundles" id="bundles" aria-label="오늘 묶음 알림"></ul>
  </section>
</main>

<script src="../shared/today-data.js"></script>
<script src="cal.js"></script>
<script>
(function () {
  var G = window.GT, esc = GTCal.esc, $ = function (s) { return document.querySelector(s); };
  var PEOPLE = [['송민재', '4-1', 1], ['정하은', '4-2', 2], ['김도윤', '4-3', 3], ['이수빈', '4-4', 4], ['박서준', '4-5', 5]];
  var hue = {}; PEOPLE.forEach(function (p) { hue[p[0]] = p[2]; });
  function av(name) { var i = hue[name]; return '<span class="av" style="' + (i ? 'background:var(--p' + i + '-bg);color:var(--p' + i + '-ink)' : 'background:var(--tone);color:var(--muted)') + '">' + esc(name.charAt(0)) + '</span>'; }

  // 사이드바(좁은 화면에서는 메뉴 버튼으로 연다)
  $('#menuBtn').onclick = function () { var o = document.body.classList.toggle('menu-open'); this.setAttribute('aria-expanded', o); this.textContent = o ? '닫기' : '메뉴'; };
  $('#people').innerHTML = PEOPLE.map(function (p) { return '<li>' + av(p[0]) + esc(p[0]) + '<span class="c num">' + p[1] + '</span></li>'; }).join('');
  $('#bell').textContent = '다음 알림 ' + G.nextBundle.at + ' · ' + G.nextBundle.label;
  $('#invite').onclick = function () { GTCal.toast('초대 링크를 복사했어요 — 가입 없이 이름만 고르고 들어와요'); };

  // 제목 줄: 질문 = 오늘 내 블록에 뭐가 있고, 낼 것은 언제 할까?
  var urgent = G.todo.filter(function (t) { return t.urgent; })[0];
  var nowSlot = G.slots.filter(function (s) { return s.k === G.nowSlot; })[0];
  var dueSlot = G.slots.filter(function (s) { var m = urgent.due.replace('오늘 ', ''); return m >= s.from && (!s.to || m < s.to); })[0];
  var mineNow = G.events.filter(function (e) { return e.mine && e.s === G.nowSlot; })[0];
  $('#date').textContent = G.date.label + ' · ' + G.date.week + ' · ' + G.school + ' ' + G.me.role;
  $('#finding').innerHTML = esc(urgent.title.replace(/\s*\(.*\)/, '')) + '가 <b class="num">' + esc(urgent.due) + '</b> 마감이에요. ' + dueSlot.label + ' 안에 내야 해요. 지금은 ' + nowSlot.label + (mineNow ? ', ' + esc(mineNow.title) + ' 중' : '') + '.';
  $('#mainAct').onclick = function () { GTCal.toast('제출 창이 열려요 (시안에서는 저장하지 않아요)'); };

  // 캘린더 + 할 일
  var cal = GTCal.mount({
    cal: $('#dayCal'), list: $('#todoList'),
    lanes: ['내 수업 · 내 일정', '4학년 · 학교', '할 일'],
    laneOf: function (k) { return { 'class': 0, school: 1, todo: 2 }[k]; },
    onChange: function (ts) {
      var placed = ts.filter(function (d) { return d.at; }).length, today = ts.filter(function (d) { return d.t.due.indexOf('오늘') === 0; }).length;
      $('#todoKpi').innerHTML = ts.length + '<small>건 남음</small>';
      $('#todoSub').textContent = '오늘 마감 ' + today + ' · 시간 정한 일 ' + placed + '/' + ts.length;
    }
  });
  $('#dayCal').classList.add('hint');

  // 한 줄 추가 → 전일 칸
  var q = $('#quick');
  q.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !q.value.trim()) return;
    G.events.push({ id: 'q' + Date.now(), title: q.value.trim(), place: '', who: '나', mine: true });
    cal.render(); GTCal.toast('「' + q.value.trim() + '」 전일에 넣었어요 — 끌어서 시간을 정할 수 있어요'); q.value = '';
  });
  document.addEventListener('keydown', function (e) { if (e.key.toLowerCase() === 'n' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });

  // 보낸 모으기 — 집계는 행에서 계산
  var s = G.sent[0], left = s.rows.filter(function (r) { return !r.done; });
  $('#sentTitle').textContent = s.title;
  $('#sentDue').textContent = s.due + ' 마감';
  $('#sentKpi').innerHTML = s.done + '<small>/ ' + s.total + '반 제출</small>';
  $('#sentBar i').style.width = (s.done / s.total * 100) + '%';
  $('#sentBar').setAttribute('aria-valuenow', s.done); $('#sentBar').setAttribute('aria-valuemax', s.total);
  $('#crew').innerHTML = s.rows.map(function (r) { var c = r.who.split(' '); return '<li><span class="c">' + c[0] + '</span>' + av(c[1]) + esc(c[1]) + '<span class="st ' + (r.done ? 'ok' : 'no') + '">' + (r.done ? '제출' : '아직') + '</span></li>'; }).join('');
  $('#nudge').onclick = function () {
    var t = left.map(function (r) { return r.who; }).join(', ') + ' 선생님, ' + s.title + '이 아직이에요. ' + s.due + ' 마감이에요.';
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { GTCal.toast('독촉 문구를 복사했어요 — ' + left.length + '반'); }, function () { GTCal.toast(t); });
  };

  // 바뀐 것
  $('#chg').innerHTML = G.changes.map(function (c) {
    return '<li>' + av(c.by) + '<b>' + esc(c.title) + ' · ' + esc(c.what) + '</b><span class="v"><s>' + esc(c.from) + '</s> → <mark>' + esc(c.to) + '</mark></span><span class="by">' + esc(c.by) + ' 선생님이 바꿈</span></li>';
  }).join('');

  // 급식 · 학사
  $('#menu').innerHTML = G.meal.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('');
  $('#kcal').textContent = G.mealKcal + ' kcal';
  var range = (/\(([^)]+)\)/.exec(G.neis) || [])[1];
  var NOW = GTCal.NOW, B = [['08:20', '08:20'], ['12:20', '12:20'], ['방과후', '14:40']];
  $('#bundles').innerHTML = B.map(function (b) { var st = b[1] < NOW ? '지남' : b[0] === G.nextBundle.at ? '다음' : '예정'; return '<li class="' + (st === '다음' ? 'next' : '') + '"><b>' + b[0] + '</b>' + st + '</li>'; }).join('');
  $('#kv').innerHTML = '<div><span>학사</span><b>' + esc(G.neis.replace(/\s*\(.*\)/, '')) + '</b></div>' + (range ? '<div><span>기간</span><b class="num">' + esc(range) + '</b></div>' : '') + '<div><span>다음 알림</span><b class="num">' + G.nextBundle.at + ' · ' + esc(G.nextBundle.label) + '</b></div>';
})();
</script>
</body>
</html>
