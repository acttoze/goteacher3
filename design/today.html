<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 · 고티처</title>
<link rel="stylesheet" href="assets/gt.css">
<style>
  /*
    오늘 — 질문: 오늘 내가 놓치면 안 되는 것과, 동학년은 지금 무엇을 하나?
    캔버스(1440): 1440 - 232 = 1208, 좌우 거터 29 → 1150. 12열 간격 24: 열 73.83.
    위 줄 8/4 = 758.7 + 24 + 367.3 = 1150. 아래 줄 5/3/4 = 465.2 + 293.5 + 367.3 + 48 = 1150.
  */
  h1 .due { color: var(--accent); }
  .title h1 { font-size: 32px; }

  /* 블록 일과판 */
  .day { padding: 0 var(--pad) var(--pad); flex: 1; display: flex; flex-direction: column; }
  .dgrid { display: grid; grid-template-columns: 96px 1fr 1fr 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 1; }
  .dgrid > div { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 10px 12px; min-width: 0; position: relative; }
  .dgrid > .lbl { border-left: 0; font-size: var(--fs-small); color: var(--muted); font-weight: 600; }
  .dgrid > .hd { border-top: 0; }
  .hd b { display: block; font-size: 16px; }
  .hd span { font-size: var(--fs-small); color: var(--muted); }
  .hd.now b { color: var(--accent); }
  .col-now { background: var(--accent-soft); }
  .ev { display: block; font-size: 15px; line-height: 1.35; padding: 8px 10px; border-radius: 8px; background: var(--surface); margin-bottom: 6px; position: relative; text-decoration: none; }
  .col-now .ev { background: #fff; }
  .ev:last-child { margin-bottom: 0; }
  .ev .p { display: block; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
  .ev.mine { background: var(--ink); color: #fff; }
  .ev.mine .p { color: #c9ccd2; }
  .ev .chg { display: block; color: var(--accent-ink); font-weight: 700; font-size: var(--fs-small); margin-top: 2px; }
  .ev del { color: var(--muted); font-weight: 400; }
  .ev.mine del { color: #a7abb3; }
  .ev .ptag { position: absolute; top: -9px; right: 6px; }
  .ev.edit { padding-top: 18px; }
  .tt { font-size: 15px; line-height: 1.35; }
  .tt b { font-weight: 600; display: block; }
  .tt span { color: var(--muted); font-size: var(--fs-small); }
  .tt.none { color: var(--muted); }
  .lunch { grid-column: 2 / span 4; display: flex; align-items: center; gap: 14px; font-size: 15px; }
  .untimed { grid-column: 2 / span 4; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .untimed > div { flex: 1 1 260px; }
  .lunch b { font-weight: 700; white-space: nowrap; }
  .lunch .k { margin-left: auto; color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
  .bprog { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bprog i { flex: 1; height: 6px; border-radius: 999px; background: var(--accent-track); overflow: hidden; }
  .bprog i b { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .bprog span { font-size: var(--fs-small); font-weight: 700; color: var(--accent); }

  /* 동학년 지금 */
  .ppl { padding: 0 var(--pad); }
  .ppl li { min-height: 76px; }
  .ppl .who b { font-size: 16px; }
  .ppl .who .c { color: var(--muted); font-size: var(--fs-small); margin-left: 6px; }
  .ppl .doing { display: flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
  .ppl li.live .doing { color: var(--ink); }

  /* 낼 것 */
  .todo { padding: 0 var(--pad) 8px; }
  .todo li { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; min-height: 84px; overflow: hidden;
    transition: opacity .3s var(--ease), min-height .35s var(--ease), max-height .35s var(--ease); max-height: 120px; }
  .todo li.gone { opacity: 0; min-height: 0; max-height: 0; padding: 0; border-top-color: transparent; }
  .todo .t a { text-decoration: none; display: inline-block; padding: 6px 0; }
  .todo .t a:hover { color: var(--accent); }
  .todo .due { font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
  .todo .due.urgent { color: var(--accent-ink); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; }
  .ck { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #aeb3bb; background: var(--bg); cursor: pointer; display: grid; place-items: center; padding: 0;
    transition: background-color .18s, border-color .18s, transform .18s var(--ease); }
  .ck { position: relative; }
  .ck::after { content: ""; position: absolute; inset: -9px; } /* 보이는 칸 28, 누르는 곳 46 */
  .ck:hover { border-color: var(--accent); }
  .ck svg { opacity: 0; transform: scale(.4); transition: opacity .18s, transform .25s cubic-bezier(.3, 1.6, .5, 1); color: #fff; }
  .done .ck { background: var(--accent); border-color: var(--accent); transform: scale(1.08); }
  .done .ck svg { opacity: 1; transform: scale(1); }
  .done .t { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }

  /* 내가 걷는 것 */
  .sent { padding: 0 var(--pad); display: flex; flex-direction: column; gap: 14px; }
  .sent .t { font-weight: 700; font-size: 17px; text-decoration: none; display: inline-block; padding: 6px 0; }
  .sent .t:hover { color: var(--accent); }
  .sent .m { font-size: var(--fs-small); color: var(--muted); }
  .who-list li { min-height: 40px; padding: 0; border: 0; gap: 10px; font-size: 15px; }
  .who-list .s { margin-left: auto; font-size: var(--fs-small); font-weight: 600; color: var(--positive); }
  .who-list .s.no { color: var(--muted); font-weight: 500; }

  /* 활동 */
  .feed { padding: 0 var(--pad); }
  .feed li { align-items: flex-start; padding: 12px 0; }
  .feed .x { font-size: 15px; line-height: 1.45; }
  .feed del { color: var(--muted); }
  .feed .when { display: block; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
  .feed li.new .when { color: var(--accent); font-weight: 600; }

  @media (max-width: 1100px) { .dgrid { grid-template-columns: 76px 1fr 1fr 1fr 1fr; } }
  @media (max-width: 760px) {
    .title h1 { font-size: 24px; }
    .dgrid { grid-template-columns: 1fr; }
    .dgrid > div { border-left: 0; }
    .dgrid > .lbl { background: var(--surface); }
    .dgrid > .lbl.hd:first-child { display: none; }
    .lunch, .untimed { grid-column: auto; flex-wrap: wrap; }
    .todo .t a, .sent .t { padding: 11px 0; }
  }
</style>
</head>
<body data-page="today">
<main class="main">
  <div class="title">
    <div class="grow">
      <h1 id="finding"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <a class="btn sec" href="schedule.html">이번 주 일정</a>
    <a class="btn pri" id="mainAct" href="submit.html"></a>
  </div>

  <div class="grid stretch">
    <section class="card s8" aria-labelledby="dayH">
      <div class="card-h"><h2 id="dayH">오늘 일과</h2><span class="n num" id="dayN"></span><span class="r" id="dayR"></span></div>
      <div class="day"><div class="dgrid" id="dgrid"></div></div>
    </section>
    <section class="card s4" aria-labelledby="pplH">
      <div class="card-h"><h2 id="pplH">동학년 지금</h2><span class="r" id="pplR"></span></div>
      <ul class="list ppl" id="ppl"></ul>
      <div class="card-f"><button class="btn sec sm" type="button" id="invite">초대 링크 복사</button><span>전담 선생님 1명이 아직이에요</span></div>
    </section>
  </div>

  <div class="grid stretch" style="margin-top:var(--gap)">
    <section class="card s5" aria-labelledby="todoH">
      <div class="card-h"><h2 id="todoH">내가 낼 것</h2><span class="n num" id="todoN"></span><span class="r">마감순 · <a class="tlink" href="collect.html#todo">모두 보기</a></span></div>
      <ul class="list todo" id="todo"></ul>
      <div class="card-f"><span id="todoFoot"></span></div>
    </section>
    <section class="card s3" aria-labelledby="sentH">
      <div class="card-h"><h2 id="sentH">내가 걷는 것</h2><span class="r" id="sentR"></span></div>
      <div class="sent" id="sent"></div>
      <div class="card-f"><button class="btn sec sm" type="button" id="nudge">독촉 문구 복사</button><a class="tlink" href="collect-detail.html">합본 보기</a></div>
    </section>
    <section class="card s4" aria-labelledby="feedH">
      <div class="card-h"><h2 id="feedH">동학년 활동</h2><span class="r">어제 퇴근 이후</span></div>
      <ul class="list feed" id="feed"></ul>
    </section>
  </div>
</main>

<script src="assets/data.js"></script>
<script src="assets/people.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var G = window.GT, U = window.GTU, $ = U.$, esc = U.esc, av = U.av, josa = U.josa;
  GTShell.mount({ quick: true, onQuick: function (r) {
    if (r.date && r.date !== '10/26(월)') return;
    G.events.push({ id: 'n' + Date.now(), s: r.slotK, title: r.title, place: r.place || '', who: G.me.name, mine: true, fresh: true });
    renderDay();
  } });

  // ---------- 상태: 화면의 숫자는 모두 여기서 ----------
  var C = G.collections[0];
  var S = {
    todo: G.todo.map(function (t) { return Object.assign({ done: false }, t); }),
    rows: C.rows.map(function (r) { return { cls: r.cls, who: r.who, done: r.v[0] !== null, just: false }; }),
    feed: G.changes.map(function (c) { return { by: c.by, html: '<b>' + esc(c.by) + '</b> 선생님이 ' + esc(c.title) + ' ' + esc(c.what) + josa(c.what, '을', '를') + ' <del>' + esc(c.from) + '</del> → <b>' + esc(c.to) + '</b>' + josa(c.to, '으로', '로') + ' 바꿨어요', when: c.when }; }),
    presence: [
      { name: '송민재', live: true, doing: '학예회 반별 참가 인원 합본 보는 중' },
      { name: '정하은', live: true, doing: '오늘 화면', me: true },
      { name: '김도윤', live: true, doing: '4학년 학년협의 보는 중', on: 'e5' },
      { name: '이수빈', live: false, doing: '2블록 수업 중 · 알림 꺼짐' },
      { name: '박서준', live: false, doing: '오늘 아직 접속 안 함' }
    ]
  };
  S.feed.push({ by: '김도윤', html: '<b>김도윤</b> 선생님이 ' + esc(C.title) + josa(C.title, '을', '를') + ' 냈어요', when: '오늘 09:12' });
  var nowSlot = G.slots.filter(function (s) { return s.k === G.nowSlot; })[0];

  // ---------- 일과판 ----------
  function pos(t, s) { function m(x) { var a = x.split(':'); return +a[0] * 60 + +a[1]; } return Math.round((m(t) - m(s.from)) / (m(s.to) - m(s.from)) * 100); }
  function evHtml(e) {
    var who = S.presence.filter(function (p) { return p.on === e.id && p.live; })[0];
    var chg = e.changed ? '<span class="chg">' + esc(e.changed.what) + ' <del>' + esc(e.changed.from) + '</del> → ' + esc(e.changed.to) + '</span>' : '';
    return '<a href="schedule.html" class="ev' + (e.mine ? ' mine' : '') + (who ? ' edit editing' : '') + (e.fresh ? ' arrive' : '') + '"' + (who ? ' style="--who:' + PEOPLE.of(who.name).color + '"' : '') + '>' + esc(e.title) + chg +
      '<span class="p">' + esc([e.place, e.who].filter(Boolean).join(' · ')) + '</span>' + (who ? U.ptag(who.name, '보는 중') : '') + '</a>';
  }
  function renderDay() {
    var h = '<div class="lbl hd"></div>';
    G.slots.forEach(function (s) {
      var now = s.k === G.nowSlot;
      h += '<div class="hd' + (now ? ' now col-now' : '') + '"><b>' + s.label + (now ? ' · 지금' : '') + '</b><span class="num">' + s.from + (s.to ? '~' + s.to : '~') + '</span>' +
        (now ? '<div class="bprog" title="블록 진행"><i><b style="width:' + pos(G.now, s) + '%"></b></i><span class="num">' + G.now + '</span></div>' : '') + '</div>';
    });
    h += '<div class="lbl">내 수업</div>';
    G.slots.forEach(function (s) {
      var t = G.timetable.filter(function (x) { return x.k === s.k; })[0];
      h += '<div class="' + (s.k === G.nowSlot ? 'col-now' : '') + '">' + (t ? '<div class="tt"><b>' + esc(t.sub) + '</b><span>' + esc(t.room) + (t.note ? ' · ' + esc(t.note) : '') + '</span></div>' : '<div class="tt none">수업 없음</div>') + '</div>';
    });
    h += '<div class="lbl">4학년 · 학교</div>';
    G.slots.forEach(function (s) { h += '<div class="' + (s.k === G.nowSlot ? 'col-now' : '') + '">' + G.events.filter(function (e) { return e.s === s.k; }).map(evHtml).join('') + '</div>'; });
    h += '<div class="lbl">점심 12:20</div><div class="lunch"><b>급식</b><span>' + G.meal.map(esc).join(' · ') + '</span><span class="k num">' + G.mealKcal + 'kcal · ' + esc(G.neis) + '</span></div>';
    h += '<div class="lbl">시간 미정</div><div class="untimed">' + G.events.filter(function (e) { return !e.s; }).map(function (e) { return '<div>' + evHtml(e) + '</div>'; }).join('') + '</div>';
    $('#dgrid').innerHTML = h;
    $('#dayN').textContent = G.events.length;
    $('#dayR').textContent = G.date.label + ' · ' + G.date.week;
  }

  // ---------- 동학년 지금 ----------
  function renderPeople() {
    var live = S.presence.filter(function (p) { return p.live; });
    $('#ppl').innerHTML = S.presence.map(function (p) {
      var r = S.rows.filter(function (x) { return x.who === p.name; })[0];
      return '<li class="' + (p.live ? 'live' : '') + '">' + av(p.name, 'lg' + (p.live ? '' : ' off')) + '<div class="who grow"><b>' + esc(p.name) + (p.me ? ' (나)' : '') + '</b><span class="c">' + esc(r ? r.cls : '') + '</span>' +
        '<div class="doing"><span class="dot' + (p.live ? '' : ' idle') + '"></span>' + esc(p.doing) + '</div></div></li>';
    }).join('');
    $('#pplR').textContent = '접속 ' + live.length + '명';
  }

  // ---------- 낼 것 ----------
  function open() { return S.todo.filter(function (t) { return !t.done; }); }
  function renderTodo() {
    var o = open();
    $('#todo').innerHTML = S.todo.map(function (t) {
      return '<li data-id="' + t.id + '" class="' + (t.done ? 'done gone' : '') + '"><button class="ck" type="button" aria-label="' + esc(t.title) + ' ' + t.kind + ' 완료로 표시" aria-pressed="' + t.done + '">' + U.icon('check', 15) + '</button>' +
        '<div><div class="t"><a href="submit.html">' + esc(t.title) + '</a></div><div class="m">' + esc(t.from) + (t.form ? ' · ' + esc(t.form) : '') + ' · ' + esc(t.kind) + '</div></div>' +
        '<span class="due num' + (t.urgent ? ' urgent' : '') + '">' + esc(t.due) + '</span></li>';
    }).join('') + (o.length ? '' : '<li style="display:block;border:0"><p class="empty">오늘 낼 것은 모두 끝났어요.</p></li>');
    $('#todoN').textContent = o.length;
    GTShell.setCount('collect', o.length);
    $('#todoFoot').textContent = o.length ? '제목을 누르면 제출 화면, 네모를 누르면 이미 낸 것으로 넘겨요.' : '다음 묶음 알림 ' + G.nextBundle.at + '에 새로 온 것이 있으면 여기에 떠요.';
    U.$$('#todo .ck').forEach(function (b) { b.onclick = function () { check(b.closest('li').dataset.id); }; });
    renderTitle();
  }
  function check(id) {
    var t = S.todo.filter(function (x) { return x.id === id; })[0]; if (!t || t.done) return;
    var li = $('#todo li[data-id="' + id + '"]');
    li.classList.add('done'); li.querySelector('.ck').setAttribute('aria-pressed', 'true');
    setTimeout(function () { li.classList.add('gone'); }, 520);
    setTimeout(function () { t.done = true; renderTodo(); U.toast('「' + t.title + '」 ' + t.kind + ' 완료', function () { t.done = false; renderTodo(); }); }, 900);
  }

  // ---------- 제목 줄: 오늘의 발견 ----------
  function renderTitle() {
    var u = open().filter(function (t) { return t.urgent; })[0], o = open(), a = $('#mainAct');
    if (u) {
      var short = u.title.replace(/ \(.*\)/, '');
      $('#finding').innerHTML = esc(short) + ', <span class="due num">' + esc(u.due) + '</span> 마감이에요';
      a.removeAttribute('aria-disabled'); a.textContent = short.replace('방과후 ', '') + ' 내기'; a.href = 'submit.html';
    } else {
      $('#finding').textContent = o.length ? '오늘 마감은 다 냈어요. 남은 건 ' + o.length + '건이에요' : '오늘 낼 것은 모두 끝났어요';
      a.setAttribute('aria-disabled', 'true'); a.textContent = '오늘 마감 없음'; a.removeAttribute('href');
    }
    var mine = G.events.filter(function (e) { return e.s === G.nowSlot && e.mine; })[0];
    $('#sub').innerHTML = esc(G.date.label) + ' · 지금 <b>' + nowSlot.label + ' ' + nowSlot.from + '~' + nowSlot.to + '</b> ' + esc(mine ? mine.title : '') + ' · 남은 내 일 <b class="num">' + o.length + '건</b>';
  }

  // ---------- 내가 걷는 것 ----------
  function renderSent() {
    var done = S.rows.filter(function (r) { return r.done; }).length, total = S.rows.length;
    $('#sent').innerHTML = '<div><a class="t" href="collect-detail.html">' + esc(C.title) + '</a><div class="m">마감 ' + esc(C.due) + '</div></div>' +
      '<div class="big"><b class="num">' + done + '</b><span class="num">/ ' + total + '반 냈어요</span></div><div class="track"><i style="width:' + (done / total * 100) + '%"></i></div>' +
      '<ul class="list who-list">' + S.rows.map(function (r) { return '<li class="' + (r.just ? 'just' : '') + '">' + av(r.who, 'sm' + (r.done ? '' : ' off')) + '<span>' + esc(r.cls + ' ' + r.who) + '</span><span class="s' + (r.done ? '' : ' no') + '">' + (r.done ? '냄' : '아직') + '</span></li>'; }).join('') + '</ul>';
    $('#sentR').innerHTML = '<span class="stack">' + S.rows.filter(function (r) { return r.done; }).map(function (r) { return av(r.who, 'sm'); }).join('') + '</span>';
    S.rows.forEach(function (r) { r.just = false; });
  }
  $('#nudge').onclick = function () {
    var left = S.rows.filter(function (r) { return !r.done; });
    if (!left.length) { U.toast('다섯 반이 다 냈어요. 독촉할 반이 없어요.'); return; }
    U.copy('[고티처] ' + C.title + ', ' + left.map(function (r) { return r.cls + ' ' + r.who; }).join(' · ') + ' 선생님 칸이 비어 있어요. ' + C.due + '까지 링크에서 채워 주세요.\nhttps://' + C.link,
      '독촉 문구를 복사했어요 · ' + left.map(function (r) { return r.cls; }).join(' · '));
  };
  $('#invite').onclick = function () { U.copy(G.space.invite, '초대 링크를 복사했어요 · ' + G.space.invite); };

  // ---------- 활동 ----------
  function renderFeed() {
    $('#feed').innerHTML = S.feed.map(function (f) { return '<li class="' + (f.isNew ? 'new arrive' : '') + '">' + av(f.by) + '<div class="x">' + f.html + '<span class="when">' + esc(f.when) + '</span></div></li>'; }).join('');
    S.feed.forEach(function (f) { f.isNew = false; });
  }

  renderDay(); renderPeople(); renderTodo(); renderSent(); renderFeed();

  // ---------- 실시간: 6초 뒤 이수빈 선생님이 칸을 채운다(시연) ----------
  setTimeout(function () {
    var r = S.rows.filter(function (x) { return x.who === '이수빈'; })[0]; if (!r || r.done) return;
    r.done = true; r.just = true;
    var p = S.presence.filter(function (x) { return x.name === '이수빈'; })[0]; p.live = true; p.doing = '방금 학예회 반별 참가 인원 냄';
    S.feed.unshift({ by: '이수빈', html: '<b>이수빈</b> 선생님이 ' + esc(C.title) + josa(C.title, '을', '를') + ' 냈어요', when: '방금', isNew: true });
    if (S.feed.length > 5) S.feed.pop();
    renderSent(); renderPeople(); renderFeed();
  }, 6000);
})();
