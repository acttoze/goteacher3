<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정 · 고티처</title>
<link rel="stylesheet" href="assets/gt.css">
<style>
  /*
    일정 — 질문: 이번 주 동학년 일정 중 내가 챙길 것과 바뀐 것은?
    캔버스 1150(1440 기준). 주간판 12열 전체, 아래 줄 7/5 = 666.8 + 24 + 459.2 = 1150.
    주간판 안: 머리 96 + 다섯 날 = 1fr.
  */
  .add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 12px; }
  .add .input { height: 52px; font-size: 18px; padding-left: 46px; border-radius: 999px; }
  .add .search svg { left: 16px; }
  .parsed { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; min-height: 40px; margin: 0 0 28px 18px; font-size: 15px; color: var(--muted); }
  .parsed b { color: var(--ink); font-weight: 700; }
  .parsed .miss { color: var(--faint); font-weight: 500; }
  .parsed .to { margin-left: auto; color: var(--accent-ink); font-weight: 600; }

  .wk { padding: 0 var(--pad) var(--pad); }
  .wgrid { display: grid; grid-template-columns: 116px repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .wgrid > div { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 10px; min-width: 0; min-height: 76px; position: relative; }
  .wgrid > .lbl { border-left: 0; font-size: var(--fs-small); color: var(--muted); font-weight: 600; min-height: 0; }
  .wgrid > .lbl span { display: block; font-weight: 400; color: var(--faint); white-space: nowrap; }
  .wgrid > .hd { border-top: 0; min-height: 0; }
  .hd b { display: block; font-size: 16px; }
  .hd span { font-size: var(--fs-small); color: var(--muted); }
  .hd.today b { color: var(--accent); }
  .tcol { background: var(--accent-soft); }
  .ev { display: block; font-size: 15px; line-height: 1.35; padding: 8px 10px; border-radius: 8px; background: var(--surface); margin-bottom: 6px; position: relative; }
  .tcol .ev { background: #fff; }
  .ev:last-child { margin-bottom: 0; }
  .ev .p { display: block; font-size: var(--fs-small); color: var(--muted); margin-top: 2px; }
  .ev.mine { background: var(--ink); color: #fff; }
  .ev.mine .p { color: #c9ccd2; }
  .ev.due { background: #fff; box-shadow: inset 0 0 0 2px var(--accent); } /* taste-skill-ignore: 마감 일정 표시(범례와 같은 표시) */
  .ev.due .k { color: var(--accent-ink); font-weight: 700; }
  .ev.neis { background: transparent; box-shadow: inset 0 0 0 1px var(--control); } /* taste-skill-ignore: 나이스 학사일정 표시(범례와 같은 표시) */
  .ev .chg { display: block; color: var(--accent-ink); font-weight: 700; font-size: var(--fs-small); margin-top: 2px; }
  .ev.mine .chg { color: #b9c8ff; }
  .ev .by { position: absolute; top: -9px; right: 6px; }
  .ev.fresh { padding-top: 16px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-small); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw-mine { background: var(--ink); }
  .sw-grade { background: var(--surface); }
  .sw-neis { box-shadow: inset 0 0 0 1px var(--control); } /* taste-skill-ignore: 범례 견본 */
  .sw-due { box-shadow: inset 0 0 0 2px var(--accent); } /* taste-skill-ignore: 범례 견본 */

  .chg-list li, .due-list li { align-items: flex-start; }
  .chg-list del { color: var(--muted); }
  .due-list .d { margin-left: auto; font-weight: 600; white-space: nowrap; text-align: right; font-size: 15px; }
  .due-list .d.today { color: var(--accent-ink); }
  .due-list a { text-decoration: none; }
  .due-list a:hover { color: var(--accent); }

  @media (max-width: 1100px) { .wgrid { grid-template-columns: 100px repeat(5, minmax(0, 1fr)); } .ev { font-size: 14px; } }
  @media (max-width: 760px) {
    .add { grid-template-columns: 1fr; }
    .add .btn { width: 100%; }
    .parsed { margin-left: 0; }
    .parsed .to { margin-left: 0; width: 100%; }
    .wgrid { display: flex; flex-direction: column; border: 0; }
    .wgrid > div { order: var(--o); }
    .card-h { flex-wrap: wrap; }
    .card-h .legend { margin-left: 0; width: 100%; }
    .wgrid > div { border: 0; padding: 0; min-height: 0; }
    .wgrid > .lbl, .wgrid > .hd, .wgrid > .empty-c { display: none; }
    .wgrid > .cell { margin-bottom: 8px; }
    .wgrid > .cell::before { content: attr(data-when); display: block; font-size: var(--fs-small); color: var(--muted); font-weight: 600; margin: 6px 0 6px; }
    .wgrid > .cell.tcol { background: none; }
  }
</style>
</head>
<body data-page="schedule">
<main class="main">
  <div class="title">
    <div class="grow">
      <h1>이번 주 일정</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="seg" role="group" aria-label="주 바꾸기"><button type="button" id="prevW">지난주</button><button type="button" aria-pressed="true">이번 주</button><button type="button" id="nextW">다음 주</button></div>
  </div>

  <div class="add">
    <label class="search"><span class="sr">한 줄로 일정 쓰기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input class="input" id="line" autocomplete="off" spellcheck="false" placeholder="한 줄로 쓰기 (예: 목요일 방과후 4-1 교실 학년협의)">
    </label>
    <button class="btn pri lg" type="button" id="addBtn">동학년 일정에 올리기</button>
  </div>
  <p class="parsed" id="parsed" aria-live="polite"></p>

  <section class="card" aria-labelledby="wkH">
    <div class="card-h"><h2 id="wkH">4학년 · 학교</h2><span class="n num" id="wkN"></span>
      <span class="r legend" id="legend"><span><i class="sw-mine"></i>내 일정</span><span><i class="sw-grade"></i>동학년</span><span><i class="sw-neis"></i>나이스 학사일정</span><span><i class="sw-due"></i>모으기 마감</span></span></div>
    <div class="wk"><div class="wgrid" id="wgrid"></div></div>
  </section>

  <div class="grid" style="margin-top:var(--gap)">
    <section class="card s7" aria-labelledby="chgH">
      <div class="card-h"><h2 id="chgH">이번 주 바뀐 것</h2><span class="n num" id="chgN"></span><span class="r">누가 바꿨는지 함께</span></div>
      <ul class="list chg-list card-b" id="chg" style="padding-bottom:var(--pad)"></ul>
    </section>
    <section class="card s5" aria-labelledby="dueH">
      <div class="card-h"><h2 id="dueH">이번 주 마감</h2><span class="n num" id="dueN"></span><span class="r"><a class="tlink" href="collect.html">모으기로</a></span></div>
      <ul class="list due-list card-b" id="due" style="padding-bottom:var(--pad)"></ul>
    </section>
  </div>
</main>

<script src="assets/data.js"></script>
<script src="assets/people.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var G = window.GT, U = window.GTU, $ = U.$, esc = U.esc;
  GTShell.mount({ quick: false, crumb: [['일정', 'schedule.html'], [G.week.label]] });
  var W = G.week, items = W.items.slice();
  var DAYIDX = { '10/26(월)': 0, '10/27(화)': 1, '10/28(수)': 2, '10/29(목)': 3, '10/30(금)': 4 };
  var ROWS = G.slots.map(function (s) { return { k: s.k, label: s.label, time: s.from + (s.to ? '~' + s.to : '~') }; }).concat([{ k: null, label: '시간 미정', time: '' }]);

  function cls(it) { return it.mine ? 'mine' : it.due ? 'due' : it.src === 'neis' ? 'neis' : ''; }
  function evHtml(it) {
    return '<div class="ev ' + cls(it) + (it.fresh ? ' fresh arrive' : '') + '">' + (it.due ? '<span class="k">마감</span> ' : '') + esc(it.title) +
      (it.changed ? '<span class="chg">' + esc(it.changed) + '</span>' : '') +
      '<span class="p">' + esc([it.place, it.src === 'neis' ? '나이스' : it.who].filter(Boolean).join(' · ')) + '</span>' +
      (it.fresh ? '<span class="by">' + U.ptag(G.me.name, '방금') + '</span>' : '') + '</div>';
  }
  function render() {
    var h = '<div class="lbl hd"></div>';
    W.days.forEach(function (d, i) { h += '<div class="hd' + (i === W.today ? ' today tcol' : '') + '"><b>' + esc(d.split(' ')[1]) + (i === W.today ? ' · 오늘' : '') + '</b><span class="num">' + esc(d.split(' ')[0]) + '</span></div>'; });
    ROWS.forEach(function (r) {
      h += '<div class="lbl">' + r.label + (r.time ? '<span class="num">' + r.time + '</span>' : '') + '</div>';
      W.days.forEach(function (d, i) {
        var evs = items.filter(function (it) { return it.d === i && it.s === r.k; });
        h += '<div style="--o:' + (i * 10 + ROWS.indexOf(r)) + '" class="' + (evs.length ? 'cell' : 'empty-c') + (i === W.today ? ' tcol' : '') + '" data-when="' + esc(d + ' · ' + r.label) + '">' + evs.map(evHtml).join('') + '</div>';
      });
    });
    $('#wgrid').innerHTML = h;
    $('#wkN').textContent = items.length;
    var chg = items.filter(function (it) { return it.changed; }), due = items.filter(function (it) { return it.due; });
    $('#sub').innerHTML = esc(W.label) + ' · ' + esc(G.date.week) + ' · 바뀐 것 <b class="num">' + chg.length + '건</b> · 마감 <b class="num">' + due.length + '건</b>';
    $('#chgN').textContent = G.changes.length;
    $('#chg').innerHTML = G.changes.map(function (c) {
      return '<li>' + U.av(c.by) + '<div class="grow"><div class="t">' + esc(c.title) + ' ' + esc(c.what) + '</div><div class="m"><del>' + esc(c.from) + '</del> → <b style="color:var(--ink)">' + esc(c.to) + '</b> · ' + esc(c.by) + ' · ' + esc(c.when) + '</div></div></li>';
    }).join('');
    $('#dueN').textContent = due.length;
    $('#due').innerHTML = due.map(function (it) {
      var t = G.todo.filter(function (x) { return it.title.indexOf(x.title.split(' ')[0]) === 0 || it.title.indexOf(x.title.replace(/ \(.*\)/, '')) === 0; })[0];
      var mine = it.who === G.me.name;
      return '<li><div class="grow"><div class="t"><a href="' + (mine ? 'collect-detail.html' : 'submit.html') + '">' + esc(it.title.replace(/ · .*$/, '')) + '</a></div><div class="m">' + (mine ? '내가 걷는 것' : '내가 낼 것 · ' + esc(it.who)) + '</div></div><span class="d num' + (it.d === W.today ? ' today' : '') + '">' + esc(W.days[it.d]) + '</span></li>';
    }).join('');
  }

  // 한 줄 일정: 쓰는 동안 나뉘는 결과를 보여 주고, 올리면 판에 바로 놓인다
  function preview() {
    var v = $('#line').value.trim();
    if (!v) { $('#parsed').innerHTML = '날짜·블록·장소를 아무 순서로 써도 알아서 나눠요. 날짜가 없으면 오늘, 블록이 없으면 「시간 미정」 줄에 놓여요.'; return null; }
    var r = U.parseLine(v);
    function kv(k, val, miss) { return '<span>' + k + ' ' + (val ? '<b>' + esc(val) + '</b>' : '<span class="miss">' + miss + '</span>') + '</span>'; }
    var d = r.date || '10/26(월)', inWeek = d in DAYIDX;
    $('#parsed').innerHTML = kv('날짜', r.date, '오늘') + kv('블록', r.slot, '시간 미정') + kv('장소', r.place, '없음') + kv('제목', r.title, '—') +
      '<span class="to">' + (inWeek ? '이번 주 ' + W.days[DAYIDX[d]].split(' ')[1] + '요일 · ' + (r.slot ? r.slot.split(' ')[0] : '시간 미정') + ' 칸에 놓여요' : esc(d) + ' 주에 놓여요') + '</span>';
    return { r: r, d: d, inWeek: inWeek };
  }
  function add() {
    var p = preview(); if (!p) { $('#line').focus(); return; }
    if (!p.r.title) { U.toast('무엇을 하는지 제목을 한두 낱말 써 주세요.'); return; }
    items.forEach(function (it) { it.fresh = false; });
    if (p.inWeek) items.push({ d: DAYIDX[p.d], s: p.r.slotK, title: p.r.title, place: p.r.place || '', who: G.me.name, mine: true, fresh: true });
    render();
    U.toast('「' + p.r.title + '」 ' + p.d + ' ' + (p.r.slot ? p.r.slot.split(' ')[0] : '시간 미정') + '에 올렸어요 · 동학년 「오늘」에 바로 보여요');
    $('#line').value = ''; preview();
  }
  $('#line').addEventListener('input', preview);
  $('#line').addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  $('#addBtn').onclick = add;
  $('#prevW').onclick = $('#nextW').onclick = function () { U.toast('시안에서는 이번 주만 보여요'); };
  render(); preview();
})();
</script>
</body>
</html>
