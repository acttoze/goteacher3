<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동학년 초대 · 고티처</title>
<link rel="stylesheet" href="assets/gt.css">
<style>
  /* 초대 입장 — 질문: 가입 없이 내 칸을 골라 바로 들어갈 수 있나? 가장 큰 것은 반 고르기. */
  .bare { max-width: 760px; }
  .inv-h { font-size: 32px; line-height: 1.18; letter-spacing: -0.04em; font-weight: 800; }
  .by { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-size: 18px; color: var(--muted); }
  .by b { color: var(--ink); }
  .card.form { margin-top: 36px; padding: 28px; gap: 26px; }
  .card.form h2 { font-size: 21px; letter-spacing: -0.02em; }
  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .slot { position: relative; display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 16px; border: 0; border-radius: 12px; background: var(--surface); text-align: left; cursor: pointer; transition: background-color .15s, transform .12s; }
  .slot:hover { background: var(--hover); }
  .slot:active { transform: scale(.98); }
  .slot b { display: block; font-size: 18px; }
  .slot span.w { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .slot[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .slot[aria-pressed="true"] span.w { color: #c9ccd2; }
  .slot .av.ghost { border-color: var(--surface); }
  .slot.open .av.ghost { background: #fff !important; color: var(--muted); }
  .slot[aria-pressed="true"] .av { border-color: var(--ink); }
  .note { font-size: 15px; color: var(--muted); }
  .done-h { display: flex; align-items: center; gap: 18px; }
  .done-h .ck { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .next-card { margin-top: 20px; padding: 24px 28px; gap: 14px; }
  .next-card h2 { font-size: 19px; }
  .gbtn { height: 48px; padding: 0 22px 0 16px; border-radius: 999px; border: 1px solid var(--control); background: #fff; display: inline-flex; align-items: center; gap: 12px; font: 700 16px/1 var(--font); cursor: pointer; align-self: flex-start; transition: background-color .15s; }
  .gbtn:hover { background: var(--surface); }
  .ok-line { color: var(--positive); font-weight: 700; }
  @media (max-width: 760px) {
    .bare-top .brand { display: flex; } /* 공용 폰 규칙이 셸용 .brand를 숨겨서 되살림 */
    .inv-h { font-size: 28px; }
    .by { font-size: 16px; flex-wrap: wrap; }
    .slots { grid-template-columns: 1fr 1fr; }
    .card.form, .next-card { padding: 20px; }
    .card.form .btn.lg { width: 100%; }
  }
</style>
</head>
<body>
<header class="bare-top">
  <a class="brand" href="landing.html" id="brand"></a>
  <span class="ctx">새솔초 4학년</span>
  <span class="end"><span class="lbl">가입·비밀번호 없음</span></span>
</header>
<main class="bare" id="m"></main>

<script src="assets/data.js"></script>
<script src="assets/people.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var G = window.GT, U = window.GTU, $ = U.$, esc = U.esc, m = $('#m');
  $('#brand').innerHTML = U.mark(24) + '고티처';
  var slots = G.members.map(function (x) { return { cls: x.cls, label: x.cls.split('-')[1] + '반', who: x.name }; })
    .concat(G.waiting.map(function (w) { return { cls: w.cls, label: w.label, who: null }; }));
  var S = { cls: '4-전담', name: '노태윤' };

  function form() {
    m.innerHTML = '<h1 class="inv-h">' + esc(G.space.name) + ' 동학년에<br>초대받았어요</h1>' +
      '<p class="by">' + U.av(G.space.by, 'sm') + '<span><b>' + esc(G.space.by) + '</b> 선생님(4-1)이 만들었어요 · 선생님 ' + G.members.length + '명</span></p>' +
      '<section class="card form" aria-labelledby="pickH"><h2 id="pickH">몇 반이세요?</h2><div class="slots" id="sl" role="group" aria-labelledby="pickH"></div>' +
      '<label class="field"><span>이름</span><input class="input lg" id="nm" value="' + esc(S.name) + '" autocomplete="name" style="max-width:320px"></label>' +
      '<div><button class="btn pri lg" type="button" id="go">들어가기</button></div>' +
      '<p class="note">이 PC 브라우저가 기억해서 다음부터는 바로 열려요. 비밀번호도 문자 인증도 없어요.</p></section>';
    function draw() {
      $('#sl').innerHTML = slots.map(function (s) {
        var avh = s.who ? U.av(s.who) : '<span class="av ghost">' + esc(s.label.charAt(0)) + '</span>';
        return '<button type="button" class="slot' + (s.who ? '' : ' open') + '" data-c="' + s.cls + '" aria-pressed="' + (s.cls === S.cls) + '">' + avh +
          '<span><b>' + esc(s.label) + '</b><span class="w">' + (s.who ? esc(s.who) + ' · 들어옴' : '아직 아무도 없어요') + '</span></span></button>';
      }).join('');
      U.$$('[data-c]').forEach(function (b) { b.onclick = function () {
        S.cls = b.dataset.c; U.clearError($('#sl')); draw();
        var s = slots.filter(function (x) { return x.cls === S.cls; })[0];
        if (s.who) U.toast(s.who + ' 선생님이 이미 들어온 반이에요. 같은 반이면 그대로 들어와도 돼요.');
      }; });
    }
    draw();
    $('#nm').addEventListener('input', function () { U.clearError(this); });
    $('#go').onclick = function () {
      var nm = $('#nm').value.trim();
      if (!S.cls) return U.fieldError($('#sl'), '몇 반인지 골라 주세요. 반이 없는 교과 선생님은 「전담」이에요.');
      if (!nm) return U.fieldError($('#nm'), '동학년에게 보일 이름을 써 주세요.');
      S.name = nm; done();
    };
  }

  function done() {
    var lab = slots.filter(function (x) { return x.cls === S.cls; })[0].label;
    m.innerHTML = '<div class="done-h"><span class="ck">' + U.icon('check', 28) + '</span><h1 class="inv-h" tabindex="-1">들어왔어요, ' + esc(S.name) + ' 선생님</h1></div>' +
      '<p class="by">' + esc(G.space.name) + ' 동학년 · ' + esc(lab) + ' · 이제 동학년 모으기와 일정이 「오늘」에 떠요.</p>' +
      '<section class="card form" aria-labelledby="whoH"><h2 id="whoH">함께 쓰는 선생님 ' + (G.members.length + 1) + '명</h2>' +
      '<div class="wrap-row"><span class="stack">' + G.members.map(function (x) { return U.av(x.name); }).join('') + '<span class="av" style="background:#6b7280">' + esc(S.name.charAt(0)) + '</span></span>' +
      '<span class="muted">' + G.members.map(function (x) { return x.name; }).join(' · ') + ' · ' + esc(S.name) + '</span></div>' +
      '<div><a class="btn pri lg" href="today.html">오늘 화면으로</a></div></section>' +
      '<section class="card next-card" aria-labelledby="gH"><h2 id="gH">다른 PC에서도 쓰려면 <span class="small muted" style="font-weight:400">선택</span></h2>' +
      '<p class="muted">교실 PC와 교무실 PC를 같이 쓰거나 PC가 초기화돼도, 구글 계정으로 이어 두면 그대로 이어져요.</p>' +
      '<div id="gw"><button class="gbtn" type="button" id="g"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>구글 계정으로 이어 두기</button></div></section>';
    $('h1').focus({ preventScroll: true });
    $('#g').onclick = function () { $('#gw').innerHTML = '<p class="ok-line">구글 계정으로 이어 뒀어요. 다른 PC에서도 구글로 들어오면 돼요.</p>'; };
  }
  form();
})();
</script>
</body>
</html>
