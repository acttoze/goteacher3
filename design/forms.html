<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양식 자료실 · 고티처</title>
<meta name="description" content="학교 업무 한글 양식 79건. 로그인 없이 보고 내려받고, 고티처로 바로 걷을 수 있어요.">
<link rel="stylesheet" href="assets/gt.css">
<style>
  /*
    양식 자료실 — 질문: 필요한 학교 양식이 있나, 바로 고티처로 걷을 수 있나?
    캔버스 1150. 목록 7 / 미리보기 5 = 666.8 + 24 + 459.2 = 1150.
  */
  .tool { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .tool .search { flex: 0 1 520px; }
  .tool .search .input { height: 48px; font-size: 17px; }
  .tool .cnt { margin-left: auto; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .tabs { margin-bottom: 0; }

  .flist { list-style: none; margin: 0; padding: 0; }
  .flist li { border-top: 1px solid var(--rule); }
  .flist li:first-child { border-top: 0; }
  .frow { width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 84px; padding: 12px 12px; margin: 0 -12px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 10px; transition: background-color .15s; width: calc(100% + 24px); }
  .frow:hover { background: #fafbfc; }
  .frow[aria-pressed="true"] { background: var(--surface); }
  .ext { height: 26px; border-radius: 6px; display: inline-grid; place-items: center; font: 700 13px/1 var(--font); background: var(--surface); color: var(--muted); }
  .frow[aria-pressed="true"] .ext { background: #fff; }
  .ext.x { color: var(--ink); }
  .frow .t { font-weight: 600; font-size: 17px; line-height: 1.35; }
  .frow .m { font-size: var(--fs-small); color: var(--muted); margin-top: 3px; }
  .frow .r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .frow .r .num { font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
  .more { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0 0; border-top: 1px solid var(--rule); font-size: 15px; color: var(--muted); }

  .detail { position: sticky; top: calc(var(--topbar) + 24px); }
  .detail h2 { font-size: 21px; line-height: 1.3; letter-spacing: -0.02em; }
  .page { background: var(--surface); border-radius: var(--radius-in); padding: 24px; display: grid; place-items: center; }
  .a4 { width: 100%; max-width: 330px; aspect-ratio: 210 / 297; background: #fff; border-radius: 2px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(13,13,13,.06); } /* taste-skill-ignore: 종이 미리보기(data-ui) */
  .a4 .ttl { font-size: 13px; font-weight: 800; text-align: center; letter-spacing: -0.01em; }
  .a4 .ln { height: 5px; border-radius: 2px; background: #e7e9ed; }
  .a4 .ln.s { width: 62%; }
  .a4 table { width: 100%; border-collapse: collapse; font-size: 9px; table-layout: fixed; }
  .a4 th, .a4 td { border: 1px solid #9aa0aa; height: 15px; padding: 0 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } /* taste-skill-ignore: 한글 표 미리보기 */
  .a4 th { background: #f1f3f6; font-weight: 700; }
  .a4 .fillable { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fact { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 15px; }
  .fact dt { color: var(--muted); }
  .fact dd { margin: 0; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .acts .btn { flex: 1 1 180px; }

  @media (max-width: 1100px) { .detail { position: static; } }
  @media (max-width: 760px) {
    .tool { flex-wrap: wrap; }
    .tool .search { flex-basis: 100%; }
    .tool .cnt { margin-left: 0; }
    .frow { grid-template-columns: 48px minmax(0, 1fr); }
    .frow .r { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
  }
</style>
</head>
<body data-page="forms">
<main class="main">
  <div class="title">
    <div class="grow">
      <h1>양식 자료실</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <div class="tool">
    <label class="search"><span class="sr">양식 찾기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="input" id="q" type="search" autocomplete="off" placeholder="양식 이름이나 표 칸으로 찾기 (예: 수요조사, 참가 인원)">
    </label>
    <span class="cnt" id="cnt"></span>
  </div>
  <nav class="tabs" id="cats" aria-label="분류"></nav>

  <div class="grid" style="margin-top:8px">
    <section class="s7" aria-labelledby="listH">
      <h2 class="sr" id="listH">양식 목록</h2>
      <ul class="flist" id="list"></ul>
      <div class="more" id="more"></div>
    </section>
    <aside class="s5 detail card" aria-labelledby="dH" id="detail"></aside>
  </div>
</main>

<script src="assets/data.js"></script>
<script src="assets/people.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var G = window.GT, U = window.GTU, $ = U.$, esc = U.esc;
  GTShell.mount({ quick: false, crumb: [['양식 자료실']] });
  var cat = 'all', sel = G.forms[0].id;
  var CN = {}; G.formCats.forEach(function (c) { CN[c.k] = c.n; });
  function total(k) { return k === 'all' ? G.formTotal : G.formCount[k]; }

  $('#sub').innerHTML = '학교 업무 한글 양식 <b class="num">' + G.formTotal + '건</b> · 로그인 없이 보고 내려받아요. 표가 있는 양식은 고티처로 바로 걷을 수 있어요.';
  $('#cats').innerHTML = G.formCats.map(function (c) {
    return '<button type="button" data-k="' + c.k + '" aria-selected="' + (c.k === cat) + '">' + c.n + '<span class="c num">' + total(c.k) + '</span></button>';
  }).join('');
  U.$$('#cats button').forEach(function (b) { b.onclick = function () { cat = b.dataset.k; U.$$('#cats button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); }); render(); }; });

  function rows() {
    var q = $('#q').value.trim();
    return G.forms.filter(function (f) { return (cat === 'all' || f.cat === cat) && (!q || (f.title + ' ' + f.table).indexOf(q) > -1); });
  }
  function render() {
    var r = rows(), q = $('#q').value.trim();
    $('#cnt').innerHTML = q ? '찾은 양식 <b class="num" style="color:var(--ink)">' + r.length + '건</b>' : CN[cat] + ' <b class="num" style="color:var(--ink)">' + total(cat) + '건</b> · 최근 고친 순';
    $('#list').innerHTML = r.length ? r.map(function (f) {
      return '<li><button class="frow" type="button" data-id="' + f.id + '" aria-pressed="' + (f.id === sel) + '"><span class="ext' + (f.ext === 'hwpx' ? ' x' : '') + '">' + f.ext.toUpperCase() + '</span>' +
        '<span><span class="t">' + esc(f.title) + '</span><span class="m" style="display:block">' + esc(CN[f.cat]) + ' · ' + f.pages + '쪽 · 표 칸 ' + esc(f.table) + '</span></span>' +
        '<span class="r">' + (f.fill ? '<span class="pill acc">바로 걷기</span>' : '<span class="pill">내려받기만</span>') + '<span class="num">' + f.updated + '</span></span></button></li>';
    }).join('') : '<li><p class="empty" style="margin:16px 0">「' + esc(q) + '」' + U.josa(q, '과', '와') + ' 맞는 양식이 ' + esc(CN[cat]) + '에 없어요. 분류를 「전체」로 바꾸거나 표 칸 이름(예: 인원)으로 찾아보세요.</p></li>';
    var shown = r.length, all = q ? r.length : total(cat);
    $('#more').innerHTML = q ? '<span>찾은 결과는 자료실 ' + G.formTotal + '건 전체에서 골랐어요.</span>' : '<span class="num">' + all + '건 중 ' + shown + '건</span><button class="btn sec sm" type="button" id="moreBtn">' + (all - shown) + '건 더 보기</button>';
    var mb = $('#moreBtn'); if (mb) mb.onclick = function () { U.toast('시안에는 양식 ' + G.forms.length + '건만 넣어 두었어요'); };
    U.$$('.frow').forEach(function (b) { b.onclick = function () { sel = b.dataset.id; render(); }; });
    if (r.length && !r.some(function (f) { return f.id === sel; })) { sel = r[0].id; return render(); }
    detail(r.length ? G.forms.filter(function (f) { return f.id === sel; })[0] : null);
  }

  function detail(f) {
    var d = $('#detail');
    if (!f) { d.innerHTML = '<div class="card-h"><h2 id="dH">미리보기</h2></div><div class="card-b"><p class="empty">왼쪽에서 양식을 고르면 첫 쪽과 표 칸이 여기에 보여요.</p></div>'; return; }
    var cols = f.table.split(' · ');
    var body = ''; for (var i = 0; i < 5; i++) body += '<tr>' + cols.map(function () { return '<td></td>'; }).join('') + '</tr>';
    d.innerHTML = '<div class="card-h"><h2 id="dH">' + esc(f.title) + '</h2></div>' +
      '<div class="card-b" style="display:flex;flex-direction:column;gap:18px">' +
      '<div class="page" data-ui aria-label="' + esc(f.title) + ' 첫 쪽 미리보기"><div class="a4">' +
        '<div class="ttl">' + esc(f.title) + '</div><div class="ln"></div><div class="ln s"></div>' +
        '<table class="' + (f.fill ? 'fillable' : '') + '"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table>' +
        '<div class="ln"></div><div class="ln"></div><div class="ln s"></div></div></div>' +
      '<dl class="fact"><dt>파일</dt><dd>' + esc(f.title.replace(/[()]/g, '')) + '.' + f.ext + ' · ' + f.pages + '쪽</dd><dt>표 칸</dt><dd>' + esc(f.table) + '</dd><dt>고친 날</dt><dd class="num">' + f.updated + '</dd>' +
      '<dt>고티처로</dt><dd>' + (f.fill ? '파란 테두리 표의 칸을 동학년이 링크로 채우고, 이 양식 그대로 돌려받아요.' : '채울 표가 없는 서식이라 내려받아서 써요.') + '</dd></dl>' +
      '<div class="acts">' + (f.fill ? '<a class="btn pri" href="collect-new.html">이 양식으로 모으기</a>' : '') + '<button class="btn sec" type="button" id="dl">' + U.icon('down', 18) + '내려받기 .' + f.ext + '</button></div></div>';
    $('#dl').onclick = function () { U.toast(f.title + '.' + f.ext + '를 내려받아요 (시안)'); };
  }

  $('#q').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
